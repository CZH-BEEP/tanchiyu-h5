<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171225">
<meta name="description" content="H5 小游戏合集：贪吃鱼与秘仪回响。">
<title>小游戏合集</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;background:#171225;overflow-x:hidden}
body{padding:28px 18px 42px;background:radial-gradient(circle at 18% 10%,rgba(245,196,95,.28),transparent 32%),radial-gradient(circle at 88% 20%,rgba(126,87,194,.28),transparent 30%),linear-gradient(160deg,#100d1d,#251831 55%,#35233a)}
.wrap{width:min(980px,100%);margin:0 auto}.hero{padding:22px 0 26px}.eyebrow{display:inline-flex;gap:8px;align-items:center;padding:8px 13px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.08);font-size:13px;color:#f7d99b}.hero h1{margin-top:18px;font-size:clamp(40px,9vw,76px);line-height:.96;letter-spacing:.08em;text-shadow:0 14px 40px rgba(0,0,0,.35)}.hero p{margin-top:18px;max-width:660px;color:#d8cde2;line-height:1.8;font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}.game{position:relative;min-height:360px;padding:22px;border-radius:30px;overflow:hidden;text-decoration:none;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 70px rgba(0,0,0,.28);transition:transform .18s,box-shadow .18s,border-color .18s}.game:active{transform:scale(.985)}.game:hover{transform:translateY(-4px);box-shadow:0 34px 90px rgba(0,0,0,.36);border-color:rgba(255,255,255,.28)}.game:before{content:"";position:absolute;inset:0;background:var(--bg);opacity:.9}.game>*{position:relative;z-index:1}.tag{display:inline-flex;padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.18);font-size:12px;font-weight:800;letter-spacing:.08em}.game h2{margin-top:18px;font-size:34px;letter-spacing:.08em}.game p{margin-top:10px;line-height:1.7;color:rgba(255,255,255,.84)}.art{position:absolute;right:18px;bottom:18px;width:180px;height:180px;opacity:.95}.btn{position:absolute;left:22px;bottom:22px;display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:999px;background:#fff;color:#1a1425;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.25)}.meta{margin-top:22px;color:#c7bdd1;font-size:13px;line-height:1.7}.fish{--bg:linear-gradient(145deg,#067196,#17a8a2)}.arcana{--bg:linear-gradient(145deg,#211126,#6c3554 55%,#c5894b)}
@media (max-width:760px){body{padding:20px 12px 30px}.grid{grid-template-columns:1fr}.game{min-height:315px}.art{width:145px;height:145px;opacity:.8}.game h2{font-size:30px}}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div class="eyebrow">✦ CZH-BEEP H5 Arcade</div>
    <h1>小游戏合集</h1>
    <p>这里保留原来的贪吃鱼，也加入一款原创 2D 复古神秘卡牌回合制小游戏。手机和电脑都能直接打开玩。</p>
  </section>
  <section class="grid" aria-label="游戏列表">
    <a class="game fish" href="./fish/">
      <span class="tag">动作成长</span>
      <h2>贪 吃 鱼</h2>
      <p>吃掉小鱼、躲避大鱼，挑战 10 个关卡，通关后解锁无尽模式。支持灵敏度调整。</p>
      <svg class="art" viewBox="0 0 180 180" aria-hidden="true"><defs><linearGradient id="sea" x1="0" x2="1"><stop stop-color="#ffd166"/><stop offset="1" stop-color="#ff7a59"/></linearGradient></defs><circle cx="88" cy="92" r="68" fill="rgba(255,255,255,.12)"/><path d="M50 93c18-31 62-34 88-3 13-13 26-18 37-19-5 15-14 27-27 36 8 11 14 22 17 35-13-3-25-10-35-21-30 25-67 21-83-9-3-6-3-13 3-19z" fill="url(#sea)"/><circle cx="106" cy="86" r="8" fill="#fff"/><circle cx="109" cy="86" r="3" fill="#12303f"/></svg>
      <span class="btn">开始游戏 →</span>
    </a>
    <a class="game arcana" href="./arcana/">
      <span class="tag">回合卡牌</span>
      <h2>秘 仪 回 响</h2>
      <p>原创世界观：在黄昏车站中收集星尘，用攻击、护盾、占卜和仪式牌击退迷雾造物。</p>
      <svg class="art" viewBox="0 0 180 180" aria-hidden="true"><circle cx="90" cy="90" r="70" fill="rgba(255,255,255,.12)"/><rect x="50" y="27" width="80" height="126" rx="13" fill="#f7d99b" transform="rotate(-7 90 90)"/><rect x="61" y="40" width="58" height="100" rx="8" fill="#23162a" transform="rotate(-7 90 90)"/><path d="M91 58l9 23 24 3-18 16 5 24-20-12-21 12 6-24-19-16 24-3z" fill="#d8a657"/><circle cx="90" cy="91" r="18" fill="none" stroke="#f7d99b" stroke-width="4"/></svg>
      <span class="btn">开始游戏 →</span>
    </a>
  </section>
  <p class="meta">提示：如果 GitHub Pages 缓存未刷新，可以稍等后强制刷新页面。</p>
</main>
</body>
</html>
