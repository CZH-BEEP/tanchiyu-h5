<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1022">
<meta name="description" content="秘仪回响：原创 2D 复古神秘卡牌回合制 H5 小游戏。">
<title>秘仪回响</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden;background:#171020;color:#f7ecd6;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none}button{font:inherit;color:inherit}#bg{position:fixed;inset:0;display:block}.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;z-index:2}.top{padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;display:flex;gap:8px;align-items:center}.pill,.tiny{border:1px solid rgba(247,217,155,.22);background:rgba(35,22,42,.62);backdrop-filter:blur(10px);border-radius:999px}.end{width:auto;padding:0 12px;font-weight:900;color:#f7d99b}.pill{padding:8px 12px;font-weight:900}.pill span{color:#d8a657;font-size:12px;margin-right:6px;font-weight:800}.tiny{width:38px;height:38px;display:grid;place-items:center;text-decoration:none}.spacer{flex:1}.field{position:relative;overflow:hidden}.side{position:absolute;top:4%;bottom:4%;width:min(42vw,360px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.side.hero{left:2%}.side.enemy{right:2%}.unit{position:relative;width:min(38vw,300px);height:min(38vw,300px);display:grid;place-items:center}.sigil{position:absolute;inset:10%;border-radius:50%;border:2px solid rgba(247,217,155,.28);box-shadow:0 0 55px rgba(216,166,87,.16) inset;animation:spin 18s linear infinite}.enemy .sigil{border-color:rgba(231,111,81,.3);animation-duration:14s}.body{width:54%;height:68%;border-radius:45% 45% 18% 18%;background:linear-gradient(#f7d99b,#9a6d3c);box-shadow:0 18px 60px rgba(0,0,0,.38);position:relative}.hero .body:before{content:"";position:absolute;left:21%;right:21%;top:-14%;height:24%;border-radius:50% 50% 25% 25%;background:#3b2443;border:3px solid #d8a657}.enemy .body{background:linear-gradient(#8b3559,#29152f);clip-path:polygon(50% 0,82% 18%,95% 78%,50% 100%,5% 78%,18% 18%)}.eye{position:absolute;left:50%;top:34%;width:20%;height:20%;transform:translateX(-50%);border-radius:50%;background:#fff;box-shadow:0 0 18px rgba(255,255,255,.7)}.eye:after{content:"";position:absolute;inset:32%;border-radius:50%;background:#2a1830}.bar{width:min(34vw,280px);padding:10px;border-radius:18px;background:rgba(10,8,16,.58);border:1px solid rgba(255,255,255,.1)}.name{display:flex;justify-content:space-between;font-weight:900;font-size:14px}.hp{height:10px;margin-top:7px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#70e0a2,#f4d35e);border-radius:inherit;transition:width .28s}.enemy .hp i{background:linear-gradient(90deg,#e76f51,#f4a261)}.shield{margin-top:6px;color:#a9def9;font-size:12px;font-weight:900;min-height:16px}.log{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(520px,62vw);padding:12px 14px;text-align:center;border-radius:20px;background:rgba(18,12,24,.62);border:1px solid rgba(247,217,155,.18);line-height:1.45;color:#f3dec0}.hand{padding:10px 10px calc(env(safe-area-inset-bottom) + 12px);display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:linear-gradient(transparent,rgba(10,8,16,.84) 16%)}.card{min-height:132px;border:0;border-radius:18px;padding:11px;text-align:left;background:linear-gradient(155deg,#f7d99b,#c68b55);color:#2a1830;box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.28);cursor:pointer;position:relative;transition:transform .12s,filter .12s}.card:active{transform:translateY(3px) scale(.98)}.card.disabled{filter:grayscale(.7) brightness(.62);cursor:not-allowed}.cost{position:absolute;right:10px;top:9px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#29152f;color:#f7d99b;font-weight:900}.card h3{font-size:17px;margin-right:32px}.card p{margin-top:8px;font-size:12px;line-height:1.45}.type{position:absolute;left:11px;bottom:10px;font-size:11px;font-weight:900;color:#6c3554}.overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:rgba(9,6,14,.58);backdrop-filter:blur(6px)}.overlay.hidden{display:none}.panel{width:min(520px,100%);border-radius:28px;padding:26px 22px;background:#f7ecd6;color:#29152f;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.45)}.panel h1{font-size:42px;letter-spacing:.12em;color:#6c3554}.panel h2{font-size:30px;color:#6c3554}.panel p{margin-top:12px;line-height:1.7;color:#654c58}.rules{margin-top:14px;text-align:left;display:grid;gap:8px}.rules div{padding:10px 12px;border-radius:14px;background:#fff7e9;color:#4f3848;font-size:13px;line-height:1.55}.rules b{color:#6c3554}.primary,.secondary{width:100%;margin-top:18px;border:0;border-radius:999px;padding:14px 18px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#6c3554,#c5894b);color:#fff;box-shadow:0 12px 26px rgba(108,53,84,.28)}.secondary{margin-top:10px;background:#ead8bd;color:#6c3554}.choice{display:grid;gap:10px;margin-top:16px}.choice button{text-align:left;border:1px solid #d9bd94;background:#fff7e9;color:#29152f;border-radius:18px;padding:13px;cursor:pointer}.choice b{display:block;color:#6c3554;margin-bottom:4px}@keyframes spin{to{transform:rotate(360deg)}}.float{position:absolute;font-weight:900;text-shadow:0 3px 10px rgba(0,0,0,.45);animation:rise .75s ease-out forwards;pointer-events:none}.hit{animation:shake .22s linear 2}.glow{animation:pulse .32s ease-out}@keyframes rise{to{transform:translateY(-42px);opacity:0}}@keyframes shake{50%{transform:translateX(8px)}}@keyframes pulse{50%{filter:drop-shadow(0 0 22px #f7d99b)}}
@media(max-width:700px){.top{gap:6px}.pill{padding:7px 9px;font-size:13px}.field{min-height:0}.side{top:5%;bottom:auto;width:48%;height:58%}.side.hero{left:0}.side.enemy{right:0}.unit{width:44vw;height:44vw}.bar{width:44vw}.log{top:auto;bottom:8px;width:calc(100% - 20px);font-size:13px}.hand{grid-template-columns:repeat(2,1fr);gap:8px}.card{min-height:106px}.card h3{font-size:15px}.card p{font-size:11px}.panel h1{font-size:34px}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="app">
  <div class="top">
    <a class="tiny" href="../" aria-label="返回合集">⌂</a>
    <div class="pill"><span>章节</span><b id="level">1</b>/6</div>
    <div class="pill"><span>能量</span><b id="energy">3</b></div>
    <div class="pill"><span>星尘</span><b id="dust">0</b></div>
    <div class="spacer"></div>
    <button class="tiny end" id="endTurn" aria-label="结束回合">终</button>
    <button class="tiny" id="sound" aria-label="音效">♪</button>
  </div>
  <main class="field" id="field">
    <div class="log" id="log">黄昏车站的钟声响起，抽取秘仪牌开始行动。</div>
    <section class="side hero">
      <div class="unit" id="heroUnit"><div class="sigil"></div><div class="body"><i class="eye"></i></div></div>
      <div class="bar"><div class="name"><span>巡星者</span><span id="heroHpText">40/40</span></div><div class="hp"><i id="heroHp"></i></div><div class="shield" id="heroShield"></div></div>
    </section>
    <section class="side enemy">
      <div class="unit" id="enemyUnit"><div class="sigil"></div><div class="body"><i class="eye"></i></div></div>
      <div class="bar"><div class="name"><span id="enemyName">雾影</span><span id="enemyHpText">30/30</span></div><div class="hp"><i id="enemyHp"></i></div><div class="shield" id="enemyIntent"></div></div>
    </section>
  </main>
  <section class="hand" id="hand"></section>
</div>
<div class="overlay" id="start">
  <div class="panel">
    <h1>秘仪回响</h1>
    <p>规则很简单：你在左边，敌人在右边。每回合用 3 点能量出牌，把敌人血量打到 0 就过关。</p>
    <div class="rules">
      <div><b>1. 看能量</b> 顶部“能量”是本回合可用点数，卡牌右上角数字是费用。</div>
      <div><b>2. 点卡牌</b> 攻击牌扣敌人血；防御牌给自己护盾；回复牌回血。</div>
      <div><b>3. 看敌人意图</b> 右侧会写敌人下回合打多少，血不多时先用镜盾/月露。</div>
      <div><b>4. 结束回合</b> 没能量或不想出牌时，点顶部“终”。过关后选一个强化继续。</div>
    </div>
    <button class="primary" id="startBtn">我懂了，开始</button>
    <button class="secondary" id="resetBtn">清除进度</button>
  </div>
</div>
<div class="overlay hidden" id="reward"><div class="panel"><h2 id="rewardTitle">章节完成</h2><p id="rewardText">选择一项强化继续。</p><div class="choice" id="choices"></div></div></div>
<div class="overlay hidden" id="over"><div class="panel"><h2 id="overTitle">回响终止</h2><p id="overText"></p><button class="primary" id="againBtn">再来一局</button><a class="secondary" href="../" style="display:block;text-decoration:none">返回合集</a></div></div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var canvas=$('bg'),ctx=canvas.getContext('2d'),W=0,H=0,DPR=1,stars=[];
var handEl=$('hand'),logEl=$('log'),field=$('field'),muted=localStorage.getItem('arcana.muted.v1')==='1',actx=null,musicTimer=null,musicStep=0;
var enemies=[['雾影售票员',32,7],['倒走钟灵',42,9],['伞下无面客',52,11],['锈月猎犬',64,13],['灰烬占星师',78,15],['终站之雾',96,18]];
var cards={strike:{name:'星弹',cost:1,type:'攻击',txt:'造成 7 点伤害。',play:function(){damage(7+G.pow)}},flare:{name:'金焰',cost:2,type:'攻击',txt:'造成 13 点伤害，获得 1 星尘。',play:function(){damage(13+G.pow);G.dust++}},guard:{name:'镜盾',cost:1,type:'防御',txt:'获得 8 点护盾。',play:function(){armor(8+G.ward)}},heal:{name:'月露',cost:2,type:'回复',txt:'回复 9 点生命。',play:function(){heal(9+G.ward)}},focus:{name:'占卜',cost:0,type:'技巧',txt:'获得 1 点能量并换一张牌。',play:function(){G.energy++;drawOne()}},rite:{name:'小仪式',cost:3,type:'仪式',txt:'造成 18 点伤害并获得 10 点护盾。',play:function(){damage(18+G.pow);armor(10+G.ward)}}};
var G;
function newGame(){G={level:1,dust:Number(localStorage.getItem('arcana.bestDust.v1')||0),maxHp:40,hp:40,shield:0,enemy:null,enemyMax:0,energy:3,deck:['strike','strike','strike','guard','guard','flare','heal','focus'],hand:[],pow:0,ward:0,turn:1,locked:false};startFight()}
function startFight(){var e=enemies[G.level-1];G.enemy={name:e[0],hp:e[1],atk:e[2]};G.enemyMax=e[1];G.energy=3;G.shield=0;G.hand=[];drawHand();msg('点下方卡牌行动：先用攻击牌打敌人，敌人要打你时用镜盾。');sync()}
function drawHand(){G.hand=[];for(var i=0;i<4;i++)drawOne()}function drawOne(){G.hand.push(G.deck[(Math.random()*G.deck.length)|0]);if(G.hand.length>4)G.hand.shift();renderHand()}
function renderHand(){handEl.innerHTML='';G.hand.forEach(function(id,idx){var c=cards[id],b=document.createElement('button');b.className='card'+(G.locked||G.energy<c.cost?' disabled':'');b.innerHTML='<span class="cost">'+c.cost+'</span><h3>'+c.name+'</h3><p>'+c.txt+'</p><span class="type">'+c.type+'</span>';b.onclick=function(){play(idx)};handEl.appendChild(b)})}
function play(i){if(G.locked)return;var id=G.hand[i],c=cards[id];if(!c||G.energy<c.cost)return;ensureAudio();G.energy-=c.cost;G.hand.splice(i,1);c.play();pop($('heroUnit'),c.name,'#f7d99b');tone(520,.07);if(G.enemy.hp<=0){winFight();return}if(G.hand.length===0||G.energy<=0)setTimeout(enemyTurn,380);sync();renderHand()}
function enemyTurn(){if(G.locked)return;G.locked=true;msg(G.enemy.name+' 凝成一次雾击。');setTimeout(function(){var raw=G.enemy.atk+Math.floor(G.level*1.5),block=Math.min(G.shield,raw),dmg=raw-block;G.shield-=block;G.hp=Math.max(0,G.hp-dmg);pop($('heroUnit'),dmg?'-'+dmg:'格挡','#ff9b85');$('heroUnit').classList.add('hit');setTimeout(function(){$('heroUnit').classList.remove('hit')},360);tone(150,.14);if(G.hp<=0){gameOver(false);return}G.energy=3;G.shield=0;G.turn++;G.locked=false;drawHand();msg('你的回合：3 点能量已恢复。');sync()},650)}
function damage(n){n=Math.round(n);G.enemy.hp=Math.max(0,G.enemy.hp-n);pop($('enemyUnit'),'-'+n,'#ffcf70');$('enemyUnit').classList.add('hit');setTimeout(function(){$('enemyUnit').classList.remove('hit')},360);tone(720,.08)}
function armor(n){G.shield+=Math.round(n);pop($('heroUnit'),'盾+'+Math.round(n),'#a9def9');$('heroUnit').classList.add('glow');setTimeout(function(){$('heroUnit').classList.remove('glow')},340)}
function heal(n){var before=G.hp;G.hp=Math.min(G.maxHp,G.hp+Math.round(n));pop($('heroUnit'),'+'+(G.hp-before),'#70e0a2')}
function winFight(){G.locked=true;G.dust+=G.level*3;localStorage.setItem('arcana.bestDust.v1',String(Math.max(G.dust,Number(localStorage.getItem('arcana.bestDust.v1')||0))));sync();tone(880,.18);if(G.level>=6){gameOver(true);return}showReward()}
function showReward(){var opts=[['星火校准','攻击牌额外 +2 伤害。',function(){G.pow+=2}],['银镜加固','防御与回复额外 +2。',function(){G.ward+=2}],['新牌：小仪式','把强力仪式牌加入牌组。',function(){G.deck.push('rite')}],['新牌：占卜','把 0 费过牌加入牌组。',function(){G.deck.push('focus')}]].sort(function(){return Math.random()-.5}).slice(0,3);$('reward').classList.remove('hidden');$('choices').innerHTML='';opts.forEach(function(o){var b=document.createElement('button');b.innerHTML='<b>'+o[0]+'</b>'+o[1];b.onclick=function(){o[2]();$('reward').classList.add('hidden');G.level++;G.locked=false;startFight()};$('choices').appendChild(b)})}
function gameOver(win){G.locked=true;$('over').classList.remove('hidden');$('overTitle').textContent=win?'终站放晴':'回响终止';$('overText').textContent=win?'你驱散了终站迷雾，带回 '+G.dust+' 枚星尘。':'你在第 '+G.level+' 章倒下，带回 '+G.dust+' 枚星尘。';tone(win?1040:120,.35)}
function sync(){$('level').textContent=G.level;$('energy').textContent=G.energy;$('dust').textContent=G.dust;$('heroHpText').textContent=G.hp+'/'+G.maxHp;$('heroHp').style.width=(G.hp/G.maxHp*100)+'%';$('heroShield').textContent=G.shield?'护盾 '+G.shield:'';$('enemyName').textContent=G.enemy.name;$('enemyHpText').textContent=G.enemy.hp+'/'+G.enemyMax;$('enemyHp').style.width=(G.enemy.hp/G.enemyMax*100)+'%';$('enemyIntent').textContent='意图：下回合攻击 '+(G.enemy.atk+Math.floor(G.level*1.5));renderHand()}
function msg(t){logEl.textContent=t}function pop(el,t,color){var r=el.getBoundingClientRect(),p=document.createElement('div');p.className='float';p.textContent=t;p.style.left=(r.left+r.width/2-18)+'px';p.style.top=(r.top+r.height/2-12)+'px';p.style.color=color;document.body.appendChild(p);setTimeout(function(){p.remove()},800)}
function ensureAudio(){if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC()}if(actx&&actx.state==='suspended')actx.resume();startMusic()}function startMusic(){if(!actx||muted||musicTimer)return;var notes=[196,233,294,349,330,294,262,233];musicTimer=setInterval(function(){if(document.hidden||muted)return;var f=notes[musicStep++%notes.length];tone(f,.42,.035,'sine');tone(f*2,.16,.018,'triangle')},560)}function stopMusic(){if(musicTimer)clearInterval(musicTimer);musicTimer=null}function tone(f,d,v,type){if(muted||!actx)return;var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(v == null ? .12 : v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.03)}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);stars=[];for(var i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.5,a:Math.random(),s:Math.random()*18+8})}
function bg(t){ctx.clearRect(0,0,W,H);var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#171020');g.addColorStop(.55,'#2a1830');g.addColorStop(1,'#5a3142');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(247,217,155,.12)';ctx.lineWidth=1;for(var i=0;i<7;i++){var y=H*(.18+i*.1)+Math.sin(t/1200+i)*10;ctx.beginPath();ctx.moveTo(0,y);ctx.bezierCurveTo(W*.3,y-35,W*.65,y+35,W,y-10);ctx.stroke()}stars.forEach(function(s){s.y+=s.s/60;if(s.y>H)s.y=-5;ctx.globalAlpha=.25+Math.sin(t/500+s.a*6)*.25;ctx.fillStyle='#f7d99b';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;requestAnimationFrame(bg)}
$('startBtn').onclick=function(){ensureAudio();$('start').classList.add('hidden');newGame()};$('resetBtn').onclick=function(){localStorage.removeItem('arcana.bestDust.v1');$('resetBtn').textContent='已清除'};$('againBtn').onclick=function(){$('over').classList.add('hidden');newGame()};$('endTurn').onclick=function(){if(G&&!G.locked)enemyTurn()};$('sound').onclick=function(){muted=!muted;localStorage.setItem('arcana.muted.v1',muted?'1':'0');$('sound').textContent=muted?'×':'♪';if(muted)stopMusic();else{ensureAudio();tone(660,.08)}};$('sound').textContent=muted?'×':'♪';addEventListener('resize',resize);resize();requestAnimationFrame(bg);
})();
</script>
</body>
</html>
