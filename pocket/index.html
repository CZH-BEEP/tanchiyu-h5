function front(){var dx=state.dir==='left'?-1:state.dir==='right'?1:0,dy=state.dir==='up'?-1:state.dir==='down'?1:0;return{x:state.x+dx,y:state.y+dy}}
function interact(){if(talking){nextText();return}if(mode==='battle')return;var p=front(),a=area();for(var i=0;i<a.npc.length;i++)if(a.npc[i].x===p.x&&a.npc[i].y===p.y)return say(a.npc[i].t);for(i=0;i<a.obj.length;i++){var o=a.obj[i];if(o.x===p.x&&o.y===p.y){if(o.got&&state.flags[o.got])return say(['这里已经空了。']);if(o.got)state.flags[o.got]=1;if(o.give){if(o.give.balls)state.balls+=o.give.balls;if(o.give.gold)state.gold+=o.give.gold;if(o.give.potions)state.potions+=o.give.potions}if(o.heal)state.team[0].hp=Math.min(state.team[0].max,state.team[0].hp+o.heal);if(o.healAll)state.team.forEach(function(p){p.hp=Math.min(p.max,p.hp+o.healAll)});save();return say(o.t)}}say(['没有可以互动的东西。'])}
function say(arr){talking=true;textQ=arr.slice();ui.dialog.classList.remove('hidden');nextText()}function nextText(){if(typing){finishType();return}if(!textQ.length){talking=false;ui.dialog.classList.add('hidden');return}typeText(textQ.shift())}function typeText(t){var i=0;ui.dialogText.textContent='';typing=setInterval(function(){ui.dialogText.textContent+=t[i++]||'';if(i>t.length)finishType()},22)}function finishType(){clearInterval(typing);typing=null}
function startEncounter(){mode='cut';sfx(720,.12);var n=0,iv=setInterval(function(){cvs.style.filter=n%2?'brightness(.3)':'brightness(1.5)';n++;if(n>8){clearInterval(iv);cvs.style.filter='';startBattle()}},70)}
function wild(){var a=area(),id=a.mons[Math.floor(Math.random()*a.mons.length)],lv=Math.max(2,state.team[0].lv+Math.floor(Math.random()*3)-1);return pet(id,lv)}
function startBattle(){mode='battle';battle={me:state.team[0],foe:wild(),log:'野生生物出现了！',float:[],phase:'choose',t:0};ui.battle.classList.add('show');renderMoves();drawBattle(0);sfx(360,.14);}
function renderMoves(){ui.moves.innerHTML='';if(!battle)return;battle.me.m.forEach(function(m){var mv=MOVES[m],good=TYPE[mv.t]&&TYPE[mv.t].strong===battle.foe.t,b=document.createElement('button');b.className='card move';b.innerHTML='<b>'+m+'</b><small>'+mv.t+'系 威力 '+mv.p+(good?'｜克制':'')+'</small>';b.onclick=function(){useMove(m)};ui.moves.appendChild(b)});var cap=document.createElement('button');cap.className='card move';cap.innerHTML='<b>方块球</b><small>剩余 '+state.balls+'｜捕捉</small>';cap.onclick=capture;ui.moves.appendChild(cap);var bag=document.createElement('button');bag.className='card move';bag.innerHTML='<b>背包</b><small>药水 / 换伙伴</small>';bag.onclick=openBag;ui.moves.appendChild(bag)}
function useMove(m){if(!battle||battle.phase!=='choose')return;battle.phase='busy';var dmg=damage(battle.me,battle.foe,m);battle.foe.hp-=dmg;float(70,35,'-'+dmg,PAL[14]);battle.log=battle.me.n+' 使用 '+m+'！';sfx(680,.08);if(battle.foe.hp<=0)return setTimeout(win,650);setTimeout(enemy,700)}function damage(a,b,m){var mv=MOVES[m],k=TYPE[mv.t]&&TYPE[mv.t].strong===b.t?1.5:1;return Math.max(2,Math.round((mv.p+a.atk-b.lv*2)*k*(.85+Math.random()*.3)))}
function enemy(){var m=battle.foe.m[Math.floor(Math.random()*4)],d=damage(battle.foe,battle.me,m);battle.me.hp-=d;float(30,67,'-'+d,PAL[14]);battle.log=battle.foe.n+' 使用 '+m+'！';sfx(160,.08);if(battle.me.hp<=0)return setTimeout(lose,800);battle.phase='choose';renderMoves();save()}
function capture(){if(!battle||battle.phase!=='choose')return;if(state.balls<=0){battle.log='没有方块球了！';return}state.balls--;battle.phase='cap';var rate=.22+(1-battle.foe.hp/battle.foe.max)*.6+(battle.me.lv-battle.foe.lv)*.04;capAnim={x:28,y:66,tx:70,ty:40,t:0,shake:0,ok:Math.random()<rate};sfx(520,.08);renderMoves()}
function win(){battle.phase='end';state.gold+=8+battle.foe.lv*2;state.balls++;var xp=12+battle.foe.lv*5;var me=battle.me;me.xp+=xp;battle.log='胜利！获得 '+xp+' 经验和金币。';if(me.xp>=me.lv*18){me.xp=0;me.lv++;me.max+=7;me.hp=me.max;me.atk+=3;battle.log+=' '+me.n+' 升到 Lv.'+me.lv+'！';sfx(880,.18)}setTimeout(endBattle,1400)}
function lose(){battle.log='战斗失败，回到区域入口。';state.team.forEach(function(p){p.hp=p.max});var sp=area().spawn;state.x=sp[0];state.y=sp[1];setTimeout(endBattle,1400)}
function endBattle(){ui.battle.classList.remove('show');mode='map';battle=null;capAnim=null;save();draw()}
function float(x,y,t,c){battle.float.push({x:x,y:y,t:t,c:c,l:45})}
function drawBattle(now){bctx.clearRect(0,0,W,H);r(bctx,0,0,W,H,PAL[12]);r(bctx,0,H*.43,W,H*.25,PAL[4]);r(bctx,0,H*.64,W,H*.36,PAL[2]);ellipse(W*.72,H*.55,150,34,PAL[5]);ellipse(W*.28,H*.78,170,38,PAL[5]);drawPet(bctx,W*.69,H*.27,battle.foe,3);drawPet(bctx,W*.22,H*.55,battle.me,4);bar(W*.56,18,battle.foe);bar(18,H*.56,battle.me);box(W*.5-260,H*.7,520,54,battle.log);battle.float.forEach(function(f){bctx.fillStyle=f.c;bctx.font='900 22px monospace';bctx.fillText(f.t,W*f.x/100,H*f.y/100-(45-f.l));f.l--});battle.float=battle.float.filter(function(f){return f.l>0});if(capAnim)drawCap();requestAnimationFrame(function(t){if(mode==='battle')drawBattle(t)})}
function ellipse(x,y,w,h,c){bctx.fillStyle=c;bctx.beginPath();bctx.ellipse(x,y,w,h,0,0,Math.PI*2);bctx.fill()}function box(x,y,w,h,t){r(bctx,x,y,w,h,PAL[5]);bctx.strokeStyle=PAL[8];bctx.lineWidth=4;bctx.strokeRect(x,y,w,h);bctx.fillStyle=PAL[8];bctx.font='900 16px sans-serif';bctx.fillText(t,x+16,y+33)}
function bar(x,y,p){r(bctx,x,y,230,52,PAL[5]);bctx.strokeStyle=PAL[8];bctx.lineWidth=4;bctx.strokeRect(x,y,230,52);bctx.fillStyle=PAL[8];bctx.font='900 15px sans-serif';bctx.fillText(p.n+' Lv.'+p.lv,x+12,y+19);r(bctx,x+12,y+30,160,10,PAL[8]);r(bctx,x+12,y+30,160*Math.max(0,p.hp/p.max),10,p.hp/p.max<.35?PAL[14]:PAL[3])}
function drawPet(c,x,y,p,s){var col=DEX[p.id].c,px=x,py=y,sz=s||3;r(c,px,py+56,72,12,'rgba(0,0,0,.25)');function q(a,b,w,h,co){r(c,px+a*sz,py+b*sz,w*sz,h*sz,co)}q(8,8,12,9,col);q(10,4,8,6,'#d8edf0');q(9,7,2,2,PAL[0]);q(17,7,2,2,PAL[0]);q(12,12,4,1,PAL[5]);if(p.id==='savage'){q(10,4,8,7,'#c17a42');q(7,11,14,10,'#6b3b22')}if(p.id==='raptor'){q(18,8,7,4,col);q(5,10,4,5,col)}if(p.id==='penguin'){q(9,5,10,14,'#273744');q(11,9,6,8,'#fff7d6')}if(p.id==='bat'){q(4,9,8,5,col);q(18,9,8,5,col)}if(p.id==='boar'){q(5,10,18,7,col);q(21,11,4,3,PAL[15])}if(p.id==='sprout'){q(10,7,9,10,col);q(8,3,5,4,PAL[3]);q(16,3,5,4,PAL[3])}}
function drawCap(){var a=capAnim;a.t++;var x=a.x+(a.tx-a.x)*Math.min(1,a.t/22),y=a.y+(a.ty-a.y)*Math.min(1,a.t/22);if(a.t>22){a.shake++;x=a.tx+Math.sin(a.shake)*7;y=a.ty}ellipse(W*x/100,H*y/100,15,15,PAL[14]);ellipse(W*x/100,H*y/100+8,15,7,PAL[5]);if(a.shake===18||a.shake===36||a.shake===54)sfx(360,.05);if(a.shake>62){if(a.ok){battle.log='捕捉成功！'+battle.foe.n+' 加入队伍。';if(state.team.length<6)state.team.push(battle.foe);sfx(920,.2);setTimeout(endBattle,900)}else{battle.log='捕捉失败！它挣脱了！';sfx(120,.12);capAnim=null;setTimeout(enemy,500)}}}
function openTeam(){ui.menuTitle.textContent='队伍';ui.menuList.innerHTML='';state.team.forEach(function(p,i){var d=document.createElement('button');d.className='card';d.innerHTML='<b>'+(i===0?'★ ':'')+p.n+' Lv.'+p.lv+'｜'+p.t+'系</b><small>HP '+Math.max(0,p.hp)+'/'+p.max+'　经验 '+p.xp+'/'+(p.lv*18)+'</small>';d.onclick=function(){if(i){var t=state.team[0];state.team[0]=state.team[i];state.team[i]=t;toast('已换 '+state.team[0].n);if(battle){battle.me=state.team[0];renderMoves()}openTeam();save()}};ui.menuList.appendChild(d)});ui.menu.classList.add('show')}
function openBag(){ui.menuTitle.textContent='背包';ui.menuList.innerHTML='';var h=document.createElement('button');h.className='card';h.innerHTML='<b>小药水 × '+state.potions+'</b><small>回复队首 35 HP</small>';h.onclick=function(){if(state.potions<=0)return toast('没有药水');state.potions--;state.team[0].hp=Math.min(state.team[0].max,state.team[0].hp+35);toast('已使用药水');if(battle){battle.me=state.team[0];renderMoves()}openBag();save()};ui.menuList.appendChild(h);var b=document.createElement('div');b.className='card';b.innerHTML='<b>方块球 × '+state.balls+'</b><small>战斗中可捕捉野生生物</small>';ui.menuList.appendChild(b);ui.menu.classList.add('show')}
function sfx(f,d){if(state.muted)return;ensureAudio();var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.06,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.03)}
function ensureAudio(){if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC()}if(actx&&actx.state==='suspended')actx.resume();if(!bgm&&!state.muted&&actx){var i=0,notes=[196,262,330,392,330,294,247,294];bgm=setInterval(function(){if(state.muted||document.hidden)return;var f=notes[i++%notes.length];sfx(f,.12)},420)}}
function toggleMusic(){state.muted=!state.muted;ui.music.textContent=state.muted?'×':'♪';save();if(!state.muted)ensureAudio()}function tick(t){if(t-last>110){last=t;if(keys.ArrowUp||keys.w)move(0,-1);else if(keys.ArrowDown||keys.s)move(0,1);else if(keys.ArrowLeft||keys.a)move(-1,0);else if(keys.ArrowRight||keys.d)move(1,0)}if(mode==='map')drawMap();requestAnimationFrame(tick)}
window.addEventListener('resize',resize);window.addEventListener('keydown',function(e){keys[e.key]=1;if(e.key===' '||e.key==='Enter')interact();if(e.key==='Escape')ui.menu.classList.remove('show');ensureAudio()});window.addEventListener('keyup',function(e){keys[e.key]=0});document.querySelectorAll('[data-d]').forEach(function(b){b.onpointerdown=function(e){e.preventDefault();var d=b.dataset.d;if(d==='up')move(0,-1);if(d==='down')move(0,1);if(d==='left')move(-1,0);if(d==='right')move(1,0);ensureAudio()}});$('btnA').onclick=interact;$('btnB').onclick=function(){ui.menu.classList.remove('show')};$('teamBtn').onclick=openTeam;$('bagBtn').onclick=openBag;$('closeMenu').onclick=function(){ui.menu.classList.remove('show')};$('save').onclick=save;$('music').onclick=toggleMusic;ui.dialog.onclick=interact;ui.music.textContent=state.muted?'×':'♪';resize();say(['欢迎来到迷你方可梦！','高草会随机遇敌，A 键互动，B 键关闭菜单。']);save();requestAnimationFrame(tick);
})();
