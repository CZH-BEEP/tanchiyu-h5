function stopMusic(){if(timer)clearInterval(timer);timer=null}
function syncSound(){el.sound.textContent=state.muted?'×':'♪';el.sound.style.opacity=state.muted?'.55':'1'}
function msg(t){el.log.textContent=t}
function toast(t){el.toast.textContent=t;el.toast.classList.add('show');setTimeout(function(){el.toast.classList.remove('show')},950)}
function updateBars(){var me=state.team[state.active],foe=state.foe;el.wins.textContent=state.wins;el.gems.textContent=state.gems;el.teamCount.textContent=state.team.length;el.meName.textContent=me.name+' Lv.'+me.lv;el.meType.textContent=me.type;el.meType.style.background=(TYPES[me.type]||{}).color||'#fff';el.meImg.src=me.img;el.meHp.style.width=Math.max(0,me.hp/me.maxHp*100)+'%';el.meHpBar.classList.toggle('low',me.hp/me.maxHp<.32);if(foe){el.foeName.textContent=foe.name+' Lv.'+foe.lv;el.foeType.textContent=foe.type;el.foeType.style.background=(TYPES[foe.type]||{}).color||'#fff';el.foeImg.src=foe.img;el.foeHp.style.width=Math.max(0,foe.hp/foe.maxHp*100)+'%';el.foeHpBar.classList.toggle('low',foe.hp/foe.maxHp<.32)}}
function renderSkills(){var me=state.team[state.active];el.skills.innerHTML='';me.skills.forEach(function(s,i){var b=document.createElement('button');b.className='skill';b.innerHTML='<b>'+s+'</b><small>'+desc(s,me)+'</small>';b.disabled=state.busy||state.turn!=='me';b.onclick=function(){useSkill(i)};el.skills.appendChild(b)})}
function desc(s,p){if(/治愈|打盹|烤热/.test(s))return '回复生命，并稳住节奏';if(/蓄力|充能|硬壳|护影|躲藏|缩壳|闪避/.test(s))return '提升能力，少量减伤';if(/火花|藤鞭|水泡|落石|电弧|暗焰|冰粒|喷火|影球/.test(s))return '属性攻击，克制会更疼';return '稳定物理攻击'}
function spawnFoe(){var pool=PETS.filter(function(p){return !state.team.some(function(t){return t.id===p.id})});var base=pool[Math.floor(Math.random()*pool.length)]||PETS[Math.floor(Math.random()*PETS.length)];state.foe=clone(base,Math.min(8,Math.floor(state.wins*.8)+Math.floor(Math.random()*2)));msg('野外跳出了 '+state.foe.name+'！选择技能开始对战。');state.turn='me';state.busy=false;updateBars();renderSkills()}
function useSkill(i){if(state.busy||state.turn!=='me')return;ensureAudio();state.busy=true;renderSkills();var me=state.team[state.active],s=me.skills[i];el.meImg.classList.add('cast');setTimeout(function(){el.meImg.classList.remove('cast')},420);if(/治愈|打盹|烤热/.test(s)){var heal=Math.round(me.maxHp*.24)+6;me.hp=Math.min(me.maxHp,me.hp+heal);msg(me.name+' 使用 '+s+'，回复 '+heal+' 点生命。');float(el.meImg,'+'+heal);tone(660,.1,.09);afterPlayer()}else if(/蓄力|充能|硬壳|护影|躲藏|缩壳|闪避/.test(s)){me.atk+=2;me.def+=1;me.hp=Math.min(me.maxHp,me.hp+5);msg(me.name+' 使用 '+s+'，攻击和防御上升。');tone(520,.09,.08);tone(780,.12,.06,.05);afterPlayer()}else{var dmg=damage(me,state.foe,s);state.foe.hp-=dmg;msg(me.name+' 使用 '+s+'，造成 '+dmg+' 点伤害！');hit(el.foeImg);float(el.foeImg,'-'+dmg);tone(220,.08,.1,'sawtooth');setTimeout(function(){if(state.foe.hp<=0)win();else afterPlayer()},520)}updateBars()}
function afterPlayer(){updateBars();setTimeout(function(){if(state.foe.hp>0)enemyTurn()},650)}
function enemyTurn(){state.turn='foe';var foe=state.foe,me=state.team[state.active];var s=foe.skills[Math.floor(Math.random()*foe.skills.length)];el.foeImg.classList.add('cast');setTimeout(function(){el.foeImg.classList.remove('cast')},420);var dmg=damage(foe,me,s);me.hp-=dmg;msg(foe.name+' 反击：'+s+'，造成 '+dmg+' 点伤害。');hit(el.meImg);float(el.meImg,'-'+dmg);tone(150,.12,.09,'sawtooth');updateBars();setTimeout(function(){if(me.hp<=0)lose();else{state.turn='me';state.busy=false;msg('轮到你了。继续出招，或者打开队伍换伙伴。');renderSkills()}},760)}
function damage(a,b,s){var base=a.atk+Math.floor(Math.random()*8)+7-b.def;var multi=(TYPES[a.type]&&TYPES[a.type].strong===b.type)?1.45:1;var heavy=/火花|藤鞭|水泡|落石|电弧|暗焰|冰粒|喷火|影球|龙息|磁暴|熔岩|黑洞|霜冻/.test(s)?1.25:1;return Math.max(3,Math.round(base*multi*heavy))}
function hit(node){node.classList.add('hit');setTimeout(function(){node.classList.remove('hit')},420)}
function float(node,text){var f=document.createElement('div');f.className='float';f.textContent=text;var r=node.getBoundingClientRect();var fr=by('field').getBoundingClientRect();f.style.left=(r.left-fr.left+r.width/2)+'px';f.style.top=(r.top-fr.top+20)+'px';by('field').appendChild(f);setTimeout(function(){f.remove()},850)}
function win(){state.busy=true;state.wins++;state.gems+=5+Math.floor(Math.random()*5);state.team[state.active].lv++;state.team[state.active].maxHp+=6;state.team[state.active].atk+=2;state.team[state.active].def+=1;state.team[state.active].hp=Math.min(state.team[state.active].maxHp,state.team[state.active].hp+18);tone(740,.12,.09);tone(988,.18,.07,'triangle',.12);var cap=Math.random()<.68||state.team.length<2;if(cap){capture(state.foe)}else{toast('获得晶块 +'+state.gems);msg('击败了 '+state.foe.name+'！它逃进草丛，继续寻找下一个对手。')}updateBars();setTimeout(spawnFoe,cap?1500:1200)}
function capture(p){var got=clone(PETS.find(function(x){return x.id===p.id})||p,Math.max(0,p.lv-1));if(state.team.length<3){state.team.push(got);toast('收服 '+got.name);msg('收服成功！'+got.name+' 加入了小队。')}else{var weakest=0;for(var i=1;i<state.team.length;i++)if(state.team[i].lv<state.team[weakest].lv)weakest=i;state.team[weakest]=got;toast('替换伙伴：'+got.name);msg('收服成功！小队已满，自动替换了等级最低的伙伴。')}}
function lose(){var alive=state.team.findIndex(function(p){return p.hp>0});if(alive>=0){state.active=alive;msg('当前伙伴倒下，换 '+state.team[alive].name+' 上场！');state.turn='me';state.busy=false;updateBars();renderSkills();return}msg('小队全员倒下，回营地休整。连胜保留，生命已恢复。');state.team.forEach(function(p){p.hp=p.maxHp});state.gems=Math.max(0,state.gems-3);state.active=0;setTimeout(spawnFoe,1200)}
function renderStarters(){el.starters.innerHTML='';[PETS[0],PETS[1],PETS[2]].forEach(function(p){var b=document.createElement('button');b.className='petBtn';b.innerHTML='<img src="'+p.img+'" alt=""><div><b>'+p.name+'</b><p>'+p.type+'系｜'+p.skills.slice(0,2).join(' / ')+'</p></div>';b.onclick=function(){ensureAudio();state.team=[clone(p,0)];state.active=0;el.start.classList.add('hidden');spawnFoe();updateBars();renderSkills()};el.starters.appendChild(b)})}
function renderTeam(){el.team.innerHTML='';state.team.forEach(function(p,i){var d=document.createElement('div');d.className='slot';d.innerHTML='<img src="'+p.img+'" alt=""><b>'+p.name+' Lv.'+p.lv+'</b><p>'+p.type+'系｜HP '+Math.max(0,p.hp)+'/'+p.maxHp+'</p>'+(i===state.active?'<button class="btn" disabled>出战中</button>':'<button class="btn" data-i="'+i+'">换上场</button>');el.team.appendChild(d)});[].forEach.call(el.team.querySelectorAll('button[data-i]'),function(b){b.onclick=function(){state.active=Number(b.getAttribute('data-i'));el.teamPanel.classList.add('hidden');msg(state.team[state.active].name+' 换上场！');updateBars();renderSkills()}})}
by('bag').onclick=function(){if(!state.team.length)return;renderTeam();el.teamPanel.classList.remove('hidden')};by('closeTeam').onclick=function(){el.teamPanel.classList.add('hidden')};el.sound.onclick=function(){state.muted=!state.muted;localStorage.setItem('pocket.muted.v1',state.muted?'1':'0');if(state.muted)stopMusic();else ensureAudio();syncSound()};document.addEventListener('pointerdown',ensureAudio,{once:true});renderStarters();syncSound();
})();
</script>
</body>
</html>
