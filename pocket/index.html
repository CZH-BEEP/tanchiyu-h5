function drawCap(){var a=capAnim;a.t++;var k=Math.min(1,a.t/24),x=a.x+(a.tx-a.x)*k,y=a.y+(a.ty-a.y)*k-28*Math.sin(k*Math.PI);if(a.t>24){a.shake++;x=a.tx+Math.sin(a.shake*.7)*9;y=a.ty+Math.abs(Math.sin(a.shake*.35))*3}var cx=W*x/100,cy=H*y/100,rad=22;if(k<1){bctx.strokeStyle='rgba(255,255,255,.7)';bctx.lineWidth=5;bctx.beginPath();bctx.moveTo(W*a.x/100,H*a.y/100);bctx.quadraticCurveTo(W*.5,H*.18,cx,cy);bctx.stroke()}var g=bctx.createRadialGradient(cx-8,cy-10,4,cx,cy,rad);g.addColorStop(0,'#fff');g.addColorStop(.42,'#ff6c6c');g.addColorStop(.48,'#26323d');g.addColorStop(.54,'#fff');g.addColorStop(1,'#d7e1ea');bctx.fillStyle=g;bctx.beginPath();bctx.arc(cx,cy,rad,0,Math.PI*2);bctx.fill();bctx.strokeStyle='#26323d';bctx.lineWidth=4;bctx.stroke();bctx.fillStyle='#fff';bctx.beginPath();bctx.arc(cx,cy,6,0,Math.PI*2);bctx.fill();bctx.stroke();if(a.shake===18||a.shake===36||a.shake===54)sfx(360,.05);if(a.shake>62){if(a.ok){battle.log='捕捉成功！'+battle.foe.n+' 加入队伍，图鉴已更新。';caught(battle.foe.id);if(battle.foe.boss)state.flags['boss_'+state.a]=1;if(state.team.length<6)state.team.push(battle.foe);state.gold+=battle.foe.boss?25:8;sfx(920,.2);setTimeout(endBattle,1200)}else{battle.log='捕捉失败！它挣脱了！';sfx(120,.12);capAnim=null;setTimeout(enemy,500)}}}
function openTeam(){ui.menuTitle.textContent='队伍';ui.menuList.innerHTML='';state.team.forEach(function(p,i){var d=document.createElement('button');d.className='card';d.innerHTML='<b>'+(i===0?'★ ':'')+p.n+' Lv.'+p.lv+'｜'+p.t+'系</b><small>HP '+Math.max(0,p.hp)+'/'+p.max+'　经验 '+p.xp+'/'+(p.lv*18)+'</small>';d.onclick=function(){if(i){var t=state.team[0];state.team[0]=state.team[i];state.team[i]=t;toast('已换 '+state.team[0].n);if(battle){battle.me=state.team[0];renderMoves()}openTeam();save()}};ui.menuList.appendChild(d)});ui.menu.classList.add('show')}
function openBag(){ui.menuTitle.textContent='背包';ui.menuList.innerHTML='';var h=document.createElement('button');h.className='card';h.innerHTML='<b>小药水 × '+state.potions+'</b><small>回复队首 35 HP</small>';h.onclick=function(){if(state.potions<=0)return toast('没有药水');state.potions--;state.team[0].hp=Math.min(state.team[0].max,state.team[0].hp+35);toast('已使用药水');if(battle){battle.me=state.team[0];renderMoves()}openBag();save()};ui.menuList.appendChild(h);var b=document.createElement('div');b.className='card';b.innerHTML='<b>方块球 × '+state.balls+'</b><small>战斗中可捕捉野生生物</small>';ui.menuList.appendChild(b);ui.menu.classList.add('show')}
function openDex(){ui.menuTitle.textContent='方可梦图鉴';ui.menuList.innerHTML='';Object.keys(DEX).forEach(function(id){var d=DEX[id],st=(state.dex&&state.dex[id])||0,el=document.createElement('div');el.className='card';el.innerHTML='<b>'+(st?d.n:'???')+'｜'+d.t+'系</b><small>'+(st===2?'已捕捉':st===1?'已见过':'未发现')+'　目标：收集 8 种并击破各区域首领</small>';ui.menuList.appendChild(el)});var p=document.createElement('div');p.className='card';p.innerHTML='<b>区域首领</b><small>草原村/森林/洞穴/水边：'+['village','forest','cave','lake'].map(function(a){return state.flags['boss_'+a]?'✓':'○'}).join(' ')+'</small>';ui.menuList.appendChild(p);ui.menu.classList.add('show')}
function sfx(f,d){if(state.muted)return;ensureAudio();var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.06,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.03)}
function ensureAudio(){if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC()}if(actx&&actx.state==='suspended')actx.resume();if(!bgm&&!state.muted&&actx){var i=0,notes=[196,262,330,392,330,294,247,294];bgm=setInterval(function(){if(state.muted||document.hidden)return;var f=notes[i++%notes.length];sfx(f,.12)},420)}}
function toggleMusic(){state.muted=!state.muted;ui.music.textContent=state.muted?'×':'♪';save();if(!state.muted)ensureAudio()}function tick(t){if(t-last>110){last=t;if(keys.ArrowUp||keys.w)move(0,-1);else if(keys.ArrowDown||keys.s)move(0,1);else if(keys.ArrowLeft||keys.a)move(-1,0);else if(keys.ArrowRight||keys.d)move(1,0)}if(mode==='map')drawMap();requestAnimationFrame(tick)}
window.addEventListener('resize',resize);window.addEventListener('keydown',function(e){keys[e.key]=1;if(e.key===' '||e.key==='Enter')interact();if(e.key==='Escape')ui.menu.classList.remove('show');ensureAudio()});window.addEventListener('keyup',function(e){keys[e.key]=0});document.querySelectorAll('[data-d]').forEach(function(b){b.onpointerdown=function(e){e.preventDefault();var d=b.dataset.d;if(d==='up')move(0,-1);if(d==='down')move(0,1);if(d==='left')move(-1,0);if(d==='right')move(1,0);ensureAudio()}});$('btnA').onclick=interact;$('btnB').onclick=function(){ui.menu.classList.remove('show')};$('dexBtn').onclick=openDex;$('teamBtn').onclick=openTeam;$('bagBtn').onclick=openBag;$('closeMenu').onclick=function(){ui.menu.classList.remove('show')};$('save').onclick=save;$('music').onclick=toggleMusic;ui.dialog.onclick=interact;ui.music.textContent=state.muted?'×':'♪';resize();say(['欢迎来到迷你方可梦！','目标：收集 8 种生物，并击破 4 个区域首领。','点右下“鉴”可查看图鉴和首领进度。']);save();requestAnimationFrame(tick);
