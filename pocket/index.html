<title>迷你方可梦</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden;background:#162b22;color:#fff;font-family:"Trebuchet MS","PingFang SC","Microsoft YaHei",sans-serif;user-select:none}button{font:inherit;color:inherit}#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;background:#74c45b}.hud{position:fixed;left:0;right:0;top:0;z-index:4;display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none}.chip,.icon,.panel,.act,.bagItem{background:#fff1bb;color:#4d2d12;border:4px solid #5b3517;border-radius:14px;box-shadow:0 5px 0 #2e1b0d;font-weight:900}.chip{padding:8px 11px}.chip span{font-size:12px;color:#8a5c25;margin-right:5px}.icon{pointer-events:auto;width:42px;height:42px;display:grid;place-items:center;text-decoration:none;cursor:pointer}.spacer{flex:1}.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);z-index:8;transform:translateX(-50%);padding:10px 16px;background:#fff1bb;color:#4d2d12;border:4px solid #5b3517;border-radius:14px;box-shadow:0 5px 0 #2e1b0d;font-weight:900;opacity:0;transition:.18s}.toast.show{opacity:1}.dialog{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:6;transform:translateX(-50%);width:min(760px,calc(100% - 22px));min-height:102px;padding:16px 18px;background:#fff1bb;color:#4d2d12;border:5px solid #5b3517;border-radius:18px;box-shadow:0 7px 0 #2e1b0d;font-weight:900;line-height:1.55}.dialog.hidden{display:none}.dialog small{display:block;margin-top:6px;color:#8a5c25}.battle{position:fixed;inset:0;z-index:10;display:none;background:linear-gradient(#88d7ff 0 42%,#b9e978 42% 67%,#70b852 67%);padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px)}.battle.show{display:grid;grid-template-rows:auto 1fr auto;gap:10px}.bTop{display:flex;gap:8px}.arena{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(#89dfff 0 47%,#b8e977 47% 65%,#6eb851 65%);box-shadow:0 8px 0 #4b8738}.arena:before{content:"";position:absolute;left:5%;right:5%;bottom:8%;height:35%;background:repeating-linear-gradient(90deg,#65aa49 0 36px,#74bd55 36px 72px);border-radius:50% 50% 0 0}.unit{position:absolute;width:min(34vw,210px);height:min(34vw,210px);image-rendering:pixelated}.unit.foe{right:10%;top:12%}.unit.me{left:10%;bottom:13%;transform:scale(1.12)}.bar{position:absolute;width:min(330px,42%);padding:10px 12px;background:#fff1bb;color:#4d2d12;border:4px solid #5b3517;border-radius:14px;box-shadow:0 5px 0 #2e1b0d;font-weight:900}.bar.foe{right:12px;top:12px}.bar.me{left:12px;bottom:12px}.row{display:flex;justify-content:space-between;gap:8px}.hp{height:12px;margin-top:7px;background:#5b3517;border-radius:999px;overflow:hidden}.hp i{display:block;height:100%;width:100%;background:linear-gradient(#8dff69,#29b83e);transition:width .25s}.hp.low i{background:linear-gradient(#ffc65a,#ff5a4e)}.battleLog{position:absolute;left:50%;bottom:28%;transform:translateX(-50%);width:min(560px,72%);padding:12px 14px;text-align:center;background:#fff1bb;color:#4d2d12;border:4px solid #5b3517;border-radius:14px;box-shadow:0 5px 0 #2e1b0d;font-weight:900}.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.act{min-height:66px;padding:10px 12px;text-align:left;cursor:pointer}.act:active,.icon:active,.bagItem:active{transform:translateY(3px);box-shadow:0 2px 0 #2e1b0d}.act small{display:block;color:#8a5c25;margin-top:4px}.menu{position:fixed;inset:0;z-index:12;display:none;place-items:center;padding:18px;background:rgba(19,49,32,.58)}.menu.show{display:grid}.panel{width:min(640px,100%);max-height:88vh;overflow:auto;padding:20px;text-align:center}.panel h1{font-size:38px;color:#5a9f35;text-shadow:2px 2px 0 #ffe17b}.list{display:grid;gap:9px;margin-top:14px}.bagItem{padding:12px;text-align:left}.bagItem b{display:block}.bagItem small{display:block;margin-top:4px;color:#8a5c25}.dpad{position:fixed;left:calc(env(safe-area-inset-left) + 16px);bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:5;width:132px;height:132px;display:none;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px}.dpad button{background:#fff1bb;color:#4d2d12;border:4px solid #5b3517;border-radius:12px;box-shadow:0 4px 0 #2e1b0d;font-weight:900}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.dpad .down{grid-column:2;grid-row:3}.tips{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:5;display:grid;gap:8px}.tips button{padding:10px 12px}.fx{position:absolute;z-index:7;width:150px;height:150px;object-fit:contain;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 0 rgba(80,60,20,.22));animation:fxpop .42s ease-out forwards}.fx.big{width:210px;height:210px}.act:after,.icon:after{content:"";position:absolute;inset:-10px;background:url("effects/actct94_ani_btn_guang/frame_000.png") center/100% 100% no-repeat;opacity:0;pointer-events:none}.act,.icon{position:relative;overflow:hidden}.act:hover:after,.icon:hover:after{opacity:.42}@keyframes fxpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}18%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.18)}}@media(max-width:760px){.dpad{display:grid}.hud{gap:5px}.chip{padding:7px 8px;font-size:13px}.dialog{font-size:14px}.bar{width:calc(50% - 18px);font-size:12px}.battleLog{bottom:34%;width:calc(100% - 22px);font-size:13px}.acts{grid-template-columns:1fr 1fr}.act{min-height:62px}.tips{right:10px}.unit.foe{right:4%;top:18%}.unit.me{left:4%;bottom:17%}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <a class="icon" href="../" aria-label="返回大厅">⌂</a>
  <div class="chip"><span>区域</span><b id="areaName">草原</b></div>
  <div class="chip"><span>队伍</span><b id="teamCount">1</b></div>
  <div class="chip"><span>球</span><b id="balls">6</b></div>
  <div class="spacer"></div>
  <button class="icon" id="saveBtn">存</button>
</div>
<div class="dialog" id="dialog">欢迎来到迷你方可梦！用方向键或左下角按钮移动，走进草丛会随机遭遇野人、迅猛龙、企鹅、狼等方块生物。<small>点击这里继续</small></div>
<div class="battle" id="battle">
  <div class="bTop"><div class="chip"><span>战斗</span><b id="battleTitle">野外遭遇</b></div><div class="spacer"></div><button class="icon" id="runBtn">跑</button></div>
  <div class="arena" id="arena">
    <canvas class="unit foe" id="foeSprite" width="128" height="128"></canvas>
    <canvas class="unit me" id="meSprite" width="128" height="128"></canvas>
    <div class="bar foe"><div class="row"><span id="foeName">野人</span><span id="foeLv">Lv.2</span></div><div class="hp" id="foeHpBar"><i id="foeHp"></i></div></div>
    <div class="bar me"><div class="row"><span id="meName">小石狼</span><span id="meLv">Lv.3</span></div><div class="hp" id="meHpBar"><i id="meHp"></i></div></div>
    <div class="battleLog" id="battleLog">野生生物出现了！</div>
  </div>
  <div class="acts" id="acts"></div>
</div>
<div class="menu" id="menu"><div class="panel"><h1 id="menuTitle">队伍</h1><div class="list" id="menuList"></div><button class="act" id="closeMenu">关闭</button></div></div>
<div class="dpad" id="dpad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="right" data-dir="right">▶</button><button class="down" data-dir="down">▼</button></div>
<div class="tips"><button class="icon" id="teamBtn">队</button><button class="icon" id="bagBtn">包</button></div>
<div class="toast" id="toast">已存档</div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=0,H=0,T=32,scale=2,viewW=15,viewH=10;
var saveKey='mini.fangke.rpg.v1',keys={},moving=false,dialogQueue=[],battle=null,mode='walk';
var ui={area:by('areaName'),teamCount:by('teamCount'),balls:by('balls'),dialog:by('dialog'),toast:by('toast'),battle:by('battle'),acts:by('acts'),battleLog:by('battleLog'),foeName:by('foeName'),foeLv:by('foeLv'),foeHp:by('foeHp'),foeHpBar:by('foeHpBar'),meName:by('meName'),meLv:by('meLv'),meHp:by('meHp'),meHpBar:by('meHpBar'),menu:by('menu'),menuTitle:by('menuTitle'),menuList:by('menuList')};
var TYPES={兽:{strong:'飞'},飞:{strong:'兽'},冰:{strong:'草'},草:{strong:'土'},土:{strong:'冰'},人:{strong:'兽'}};
var SKILLS={撞击:{pow:10,type:'兽'},吼叫:{pow:7,type:'兽'},石斧:{pow:13,type:'人'},突刺:{pow:12,type:'兽'},冰球:{pow:12,type:'冰'},啄击:{pow:10,type:'飞'},扑咬:{pow:13,type:'兽'},滚撞:{pow:11,type:'土'},藤刺:{pow:12,type:'草'},重踏:{pow:14,type:'土'}};
var DEX={
  wolf:{name:'方狼',type:'兽',color:'#6b7d8c',hp:42,atk:12,skills:['撞击','吼叫','扑咬','滚撞']},
  savage:{name:'野人',type:'人',color:'#9b6b3a',hp:46,atk:13,skills:['撞击','石斧','吼叫','重踏']},
  raptor:{name:'迅猛龙',type:'兽',color:'#48a45c',hp:44,atk:15,skills:['突刺','扑咬','撞击','吼叫']},
  penguin:{name:'冰原企鹅',type:'冰',color:'#69b7df',hp:40,atk:12,skills:['冰球','啄击','撞击','吼叫']},
  boar:{name:'野猪兽',type:'土',color:'#a05f35',hp:50,atk:12,skills:['滚撞','重踏','撞击','吼叫']},
  sprout:{name:'草团子',type:'草',color:'#6fc15b',hp:38,atk:11,skills:['藤刺','撞击','吼叫','滚撞']}
};
var AREAS={
  grass:{name:'草原村',w:28,h:18,spawn:{x:4,y:8},next:{x:26,y:8,to:'snow',tx:2,ty:8},enc:['wolf','savage','raptor','boar'],npc:{x:8,y:6,text:['村长：草丛里有很多方块生物。','先练到 5 级，再去东边雪原会更稳。']}},
  snow:{name:'雪原湖',w:26,h:18,spawn:{x:2,y:8},next:{x:0,y:8,to:'grass',tx:25,ty:8},enc:['penguin','wolf','sprout','raptor'],npc:{x:12,y:7,text:['雪原守卫：企鹅怕草系，但能克制草。','打不过就打开背包，换上更健康的伙伴。']}}
};
var state=load()||fresh();
function by(id){return document.getElementById(id)}
function fresh(){return {area:'grass',x:4,y:8,balls:6,potions:3,seen:0,team:[makePet('wolf',3)],bag:{balls:6,potions:3}}}
function makePet(id,lv){var d=DEX[id],p={id:id,name:d.name,type:d.type,lv:lv||2,xp:0,maxHp:d.hp+(lv||2)*5,hp:d.hp+(lv||2)*5,atk:d.atk+(lv||2)*2,skills:d.skills.slice()};return p}
function load(){try{return JSON.parse(localStorage.getItem(saveKey)||'null')}catch(e){return null}}
function save(){localStorage.setItem(saveKey,JSON.stringify(state));toast('已存档，退出后还能继续')}
function toast(t){ui.toast.textContent=t;ui.toast.classList.add('show');setTimeout(function(){ui.toast.classList.remove('show')},1000)}
function resize(){var dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.max(2,Math.floor(Math.min(W/360,H/260)));T=16*scale;viewW=Math.ceil(W/T)+2;viewH=Math.ceil(H/T)+2;draw()}
function area(){return AREAS[state.area]}
function tileAt(x,y){var a=area();if(x<0||y<0||x>=a.w||y>=a.h)return 'wall';if(a.next&&x===a.next.x&&y===a.next.y)return 'gate';if(a.npc&&x===a.npc.x&&y===a.npc.y)return 'npc';if(y<2||x<1||y>a.h-2||x>a.w-2)return 'tree';var snow=state.area==='snow';if((x*y+x+y)%11===0)return 'rock';if((x+2*y)%5===0)return 'grass';if(snow&&(x+3*y)%7===0)return 'ice';return 'path'}
function blocked(x,y){var t=tileAt(x,y);return t==='wall'||t==='tree'||t==='rock'||t==='npc'}
function draw(){ctx.clearRect(0,0,W,H);var a=area(),ox=Math.floor(W/2-state.x*T-T/2),oy=Math.floor(H/2-state.y*T-T/2);ui.area.textContent=a.name;ui.teamCount.textContent=state.team.length;ui.balls.textContent=state.bag.balls;for(var y=0;y<a.h;y++)for(var x=0;x<a.w;x++)drawTile(x,y,ox+x*T,oy+y*T);if(a.npc)drawHuman(ox+a.npc.x*T,oy+a.npc.y*T,'#e2b05d','#8a4b25');drawPlayer(ox+state.x*T,oy+state.y*T);}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function drawTile(tx,ty,x,y){var t=tileAt(tx,ty),snow=state.area==='snow',base=snow?'#d7f4ff':'#83c965';rect(x,y,T,T,base);if(t==='path')rect(x,y+T*.62,T,T*.38,snow?'#c8e7ee':'#91d36b');if(t==='grass'){rect(x,y,T,T,snow?'#c3edf3':'#6fbd50');for(var i=0;i<4;i++)rect(x+(i*5+3)*scale,y+(8+i%2*3)*scale,2*scale,6*scale,snow?'#9dd8df':'#3f8f33')}if(t==='tree'){rect(x,y,T,T,snow?'#bce6ee':'#5faa3f');rect(x+5*scale,y+8*scale,6*scale,8*scale,'#75451f');rect(x+2*scale,y+2*scale,12*scale,9*scale,snow?'#eaffff':'#357a2c')}if(t==='rock'){rect(x+4*scale,y+5*scale,9*scale,8*scale,snow?'#9fb4c1':'#777b70');rect(x+6*scale,y+3*scale,6*scale,4*scale,snow?'#d6edf5':'#a7aa9d')}if(t==='gate'){rect(x,y,T,T,'#f5d75b');rect(x+3*scale,y+3*scale,10*scale,10*scale,'#fff1bb')}}
function drawPlayer(x,y){drawHuman(x,y,'#ffd36a','#457bd8')}
function drawHuman(x,y,skin,cloth){rect(x+5*scale,y+2*scale,6*scale,5*scale,skin);rect(x+4*scale,y+7*scale,8*scale,6*scale,cloth);rect(x+3*scale,y+13*scale,4*scale,3*scale,'#3a2a1a');rect(x+9*scale,y+13*scale,4*scale,3*scale,'#3a2a1a');rect(x+6*scale,y+4*scale,1*scale,1*scale,'#222');rect(x+9*scale,y+4*scale,1*scale,1*scale,'#222')}
function move(dx,dy){if(mode!=='walk'||moving)return;var nx=state.x+dx,ny=state.y+dy,a=area();if(a.next&&nx===a.next.x&&ny===a.next.y){state.area=a.next.to;state.x=a.next.tx;state.y=a.next.ty;toast('进入 '+area().name);save();draw();return}if(a.npc&&nx===a.npc.x&&ny===a.npc.y){say(a.npc.text);return}if(blocked(nx,ny)){toast('过不去');return}state.x=nx;state.y=ny;draw();if(tileAt(nx,ny)==='grass'&&Math.random()<.18)startBattle()}
function say(lines){dialogQueue=lines.slice();nextDialog()}
function nextDialog(){if(!dialogQueue.length){ui.dialog.classList.add('hidden');return}ui.dialog.innerHTML=dialogQueue.shift()+'<small>点击继续</small>';ui.dialog.classList.remove('hidden')}
function randomFoe(){var a=area(),id=a.enc[Math.floor(Math.random()*a.enc.length)],lv=Math.max(2,Math.floor(state.team[0].lv+Math.random()*3-1));return makePet(id,lv)}
function startBattle(){mode='battle';battle={foe:randomFoe(),me:state.team[0],turn:'me',over:false};ui.battle.classList.add('show');ui.battleLog.textContent='野生 '+battle.foe.name+' 出现了！';syncBattle();drawPet(by('meSprite'),battle.me);drawPet(by('foeSprite'),battle.foe);renderActs();}
function drawPet(c,p){var g=c.getContext('2d');g.clearRect(0,0,128,128);g.imageSmoothingEnabled=false;var col=DEX[p.id].color;function r(x,y,w,h,c){g.fillStyle=c;g.fillRect(x*8,y*8,w*8,h*8)}r(5,6,6,6,col);r(4,8,8,5,col);r(6,4,4,3,light(col));r(5,7,1,1,'#111');r(10,7,1,1,'#111');r(7,10,2,1,'#fff1bb');if(p.id==='raptor'){r(11,5,3,2,col);r(12,4,2,1,light(col));r(3,9,2,2,col)}if(p.id==='penguin'){r(6,5,4,7,'#263744');r(7,7,2,4,'#fff');r(5,12,2,1,'#f5b642');r(9,12,2,1,'#f5b642')}if(p.id==='savage'){r(6,3,4,4,'#b77b48');r(5,7,6,6,'#6b3b22');r(4,8,1,5,'#b77b48');r(11,8,1,5,'#b77b48')}if(p.id==='wolf'){r(3,5,3,2,col);r(11,5,2,2,col);r(3,11,2,3,col);r(10,11,2,3,col)}if(p.id==='boar'){r(4,7,9,5,col);r(3,8,2,3,col);r(12,8,2,3,'#e7d6b4')}if(p.id==='sprout'){r(5,7,6,5,col);r(7,4,2,3,'#3c9b35');r(4,5,3,2,'#61c454');r(9,5,3,2,'#61c454')}}
function light(hex){return '#d8f0a2'}
function syncBattle(){var me=battle.me,foe=battle.foe;ui.foeName.textContent=foe.name;ui.foeLv.textContent='Lv.'+foe.lv;ui.meName.textContent=me.name;ui.meLv.textContent='Lv.'+me.lv;ui.foeHp.style.width=Math.max(0,foe.hp/foe.maxHp*100)+'%';ui.meHp.style.width=Math.max(0,me.hp/me.maxHp*100)+'%';ui.foeHpBar.classList.toggle('low',foe.hp/foe.maxHp<.35);ui.meHpBar.classList.toggle('low',me.hp/me.maxHp<.35)}
function renderActs(){ui.acts.innerHTML='';if(!battle||battle.over)return;battle.me.skills.forEach(function(s){var b=document.createElement('button');b.className='act';b.innerHTML='<b>'+s+'</b><small>'+SKILLS[s].type+'系 威力 '+SKILLS[s].pow+'</small>';b.onclick=function(){playerSkill(s)};ui.acts.appendChild(b)});var cap=document.createElement('button');cap.className='act';cap.innerHTML='<b>方块球</b><small>剩余 '+state.bag.balls+'，尝试捕捉</small>';cap.onclick=capture;ui.acts.appendChild(cap);var bag=document.createElement('button');bag.className='act';bag.innerHTML='<b>背包</b><small>使用药水或切换伙伴</small>';bag.onclick=function(){openBag()};ui.acts.appendChild(bag)}
function playFx(name,x,y,big){var arena=by('arena'),img=document.createElement('img'),i=0,total=name==='ani_yufahuo'||name==='ani_suipian3'?4:2;img.className='fx'+(big?' big':'');img.style.left=x+'%';img.style.top=y+'%';arena.appendChild(img);function step(){img.src='effects/'+name+'/frame_'+('000'+i).slice(-3)+'.png';i++;if(i<total)setTimeout(step,80);else setTimeout(function(){img.remove()},260)}step()}
function playerSkill(s){if(!battle||battle.over)return;var dmg=calc(battle.me,battle.foe,s);battle.foe.hp-=dmg;playFx('ani_yufahuo',76,37,true);ui.battleLog.textContent=battle.me.name+' 使用 '+s+'，造成 '+dmg+' 点伤害！';syncBattle();if(battle.foe.hp<=0)return winBattle(false);setTimeout(enemyTurn,650)}
function enemyTurn(){if(!battle||battle.over)return;var s=battle.foe.skills[Math.floor(Math.random()*battle.foe.skills.length)],dmg=calc(battle.foe,battle.me,s);battle.me.hp-=dmg;ui.battleLog.textContent='野生 '+battle.foe.name+' 使用 '+s+'，造成 '+dmg+' 点伤害。';syncBattle();if(battle.me.hp<=0)return loseBattle();save()}
function calc(a,b,s){var sk=SKILLS[s],m=(TYPES[sk.type]&&TYPES[sk.type].strong===b.type)?1.5:1;return Math.max(2,Math.round((sk.pow+a.atk-b.lv*2)*m*(.85+Math.random()*.3)))}
function capture(){if(!battle||battle.over)return;if(state.bag.balls<=0){ui.battleLog.textContent='没有方块球了！';return}state.bag.balls--;var rate=.25+(1-battle.foe.hp/battle.foe.maxHp)*.55+(battle.me.lv-battle.foe.lv)*.04;var ok=Math.random()<rate;syncHud();playFx(ok?'ani_suipian3':'actct94_ani_btn_guang',76,37,true);if(ok){ui.battleLog.textContent='捕捉成功！'+battle.foe.name+' 加入队伍。';if(state.team.length<6)state.team.push(battle.foe);else ui.battleLog.textContent+=' 队伍已满，已登记到图鉴。';state.seen++;setTimeout(function(){endBattle(true)},520)}else{ui.battleLog.textContent='捕捉失败！'+battle.foe.name+' 挣脱了方块球。';setTimeout(enemyTurn,760)}}
function winBattle(caught){battle.over=true;var me=battle.me;if(!caught){ui.battleLog.textContent='战斗胜利！获得经验，捡到 1 个方块球。';state.bag.balls++;me.xp+=12+battle.foe.lv*4;if(me.xp>=me.lv*18){me.xp=0;me.lv++;me.maxHp+=7;me.hp=me.maxHp;me.atk+=3;toast(me.name+' 升到 Lv.'+me.lv)}}setTimeout(function(){endBattle(true)},900)}
function loseBattle(){battle.over=true;ui.battleLog.textContent='战斗失败，回到区域入口并恢复队伍。';state.team.forEach(function(p){p.hp=p.maxHp});state.x=area().spawn.x;state.y=area().spawn.y;setTimeout(function(){endBattle(true)},1100)}
function endBattle(keep){ui.battle.classList.remove('show');battle=null;mode='walk';syncHud();save();draw()}
function syncHud(){ui.teamCount.textContent=state.team.length;ui.balls.textContent=state.bag.balls;ui.area.textContent=area().name}
function openTeam(){ui.menuTitle.textContent='队伍';ui.menuList.innerHTML='';state.team.forEach(function(p,i){var d=document.createElement('button');d.className='bagItem';d.innerHTML='<b>'+(i===0?'★ ':'')+p.name+' Lv.'+p.lv+'｜'+p.type+'系</b><small>HP '+Math.max(0,p.hp)+'/'+p.maxHp+'　经验 '+p.xp+'/'+(p.lv*18)+'</small>';d.onclick=function(){if(i>0){var t=state.team[0];state.team[0]=state.team[i];state.team[i]=t;toast('已换 '+state.team[0].name+' 出战');syncBattleMaybe();openTeam();save()}};ui.menuList.appendChild(d)});ui.menu.classList.add('show')}
function openBag(){ui.menuTitle.textContent='背包';ui.menuList.innerHTML='';var heal=document.createElement('button');heal.className='bagItem';heal.innerHTML='<b>小药水 × '+state.bag.potions+'</b><small>回复首位伙伴 30 点生命</small>';heal.onclick=function(){if(state.bag.potions<=0)return toast('没有药水了');var p=state.team[0];state.bag.potions--;p.hp=Math.min(p.maxHp,p.hp+30);toast('已回复 '+p.name);syncBattleMaybe();openBag();save()};ui.menuList.appendChild(heal);var ball=document.createElement('div');ball.className='bagItem';ball.innerHTML='<b>方块球 × '+state.bag.balls+'</b><small>战斗中可以用来捕捉野生生物</small>';ui.menuList.appendChild(ball);ui.menu.classList.add('show')}
function syncBattleMaybe(){if(battle){battle.me=state.team[0];syncBattle();drawPet(by('meSprite'),battle.me);renderActs()}syncHud()}
window.addEventListener('keydown',function(e){keys[e.key]=true;if(e.key==='ArrowUp'||e.key==='w')move(0,-1);if(e.key==='ArrowDown'||e.key==='s')move(0,1);if(e.key==='ArrowLeft'||e.key==='a')move(-1,0);if(e.key==='ArrowRight'||e.key==='d')move(1,0);if(e.key===' ')nextDialog()});
by('dialog').onclick=nextDialog;by('saveBtn').onclick=save;by('teamBtn').onclick=openTeam;by('bagBtn').onclick=openBag;by('closeMenu').onclick=function(){ui.menu.classList.remove('show')};by('runBtn').onclick=function(){if(battle){ui.battleLog.textContent='你逃离了战斗。';setTimeout(function(){endBattle(true)},450)}};document.querySelectorAll('#dpad button').forEach(function(b){b.addEventListener('pointerdown',function(e){e.preventDefault();var d=b.getAttribute('data-dir');if(d==='up')move(0,-1);if(d==='down')move(0,1);if(d==='left')move(-1,0);if(d==='right')move(1,0)})});
window.addEventListener('resize',resize);resize();syncHud();draw();save();
})();
</script>
</body>
</html>
