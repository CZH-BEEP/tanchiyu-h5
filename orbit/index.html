<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07121f"><title>轨道残骸站</title><style>
:root{--bg:#07121f;--panel:#102337;--panel2:#172f48;--line:#35d9ff;--line2:#ff9f38;--red:#ff465f;--blue:#36d8ff;--green:#58e698;--yellow:#ffd25a;--txt:#e9fbff;--mut:#84a9bb;--r:18px;--stroke:2px;--num:"Roboto Mono","SFMono-Regular",Consolas,monospace;--ui:"Trebuchet MS","PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 70% 15%,#153456,#07121f 58%);color:var(--txt);font-family:var(--ui);user-select:none}button{font:inherit;color:inherit}.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 10px)}.nav-bar,.panel,.task-bar{border:var(--stroke) solid rgba(53,217,255,.72);background:linear-gradient(180deg,rgba(23,47,72,.92),rgba(10,22,35,.94));box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 0 24px rgba(53,217,255,.14);border-radius:var(--r)}.nav-bar{display:flex;gap:8px;align-items:center;padding:8px;min-height:56px}.badge{height:38px;display:inline-flex;align-items:center;gap:7px;padding:0 10px;border:var(--stroke) solid rgba(53,217,255,.62);border-radius:999px;background:rgba(5,16,28,.7);box-shadow:0 0 14px rgba(53,217,255,.1) inset}.badge i,.btn i{width:22px;height:22px;display:grid;place-items:center;font-style:normal}.badge b{font-family:var(--num);font-size:15px;letter-spacing:.02em}.spacer{flex:1}.btn{border:var(--stroke) solid var(--line);background:linear-gradient(180deg,#1d5874,#0e2a45);border-radius:14px;padding:10px 12px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 4px 0 #06111d,0 0 18px rgba(53,217,255,.18);cursor:pointer}.btn.warn{border-color:var(--line2);background:linear-gradient(180deg,#8b4a15,#30190e)}.btn.danger{border-color:var(--red);background:linear-gradient(180deg,#8d2332,#30101a)}.btn:active,.building-card:active,.hero-card:active{transform:translateY(3px);box-shadow:0 1px 0 #06111d}.stage{display:grid;grid-template-columns:1.1fr .9fr;gap:10px;min-height:0}.space{position:relative;overflow:hidden}.panel{padding:12px}.station{position:absolute;left:50%;top:45%;width:min(43vw,430px);height:min(43vw,430px);transform:translate(-50%,-50%);border-radius:50%;border:2px dashed rgba(53,217,255,.35);display:grid;place-items:center}.core{width:110px;height:110px;border-radius:28px;background:linear-gradient(135deg,#122b43,#203e5e);border:3px solid var(--line);box-shadow:0 0 34px rgba(53,217,255,.35);display:grid;place-items:center;font-size:40px}.module{position:absolute;width:78px;height:54px;border:2px solid rgba(53,217,255,.8);border-radius:16px;background:linear-gradient(180deg,#183653,#0c1f33);display:grid;place-items:center;font-size:25px;box-shadow:0 0 18px rgba(53,217,255,.16)}.debris{position:absolute;width:10px;height:10px;background:#8fb1c5;border-radius:2px;box-shadow:0 0 8px rgba(255,255,255,.45)}.event{position:absolute;left:14px;right:14px;bottom:14px}.task-bar{padding:10px;display:grid;gap:8px}.progress{height:12px;border:2px solid rgba(53,217,255,.45);border-radius:999px;background:#06111d;overflow:hidden}.progress i{display:block;height:100%;width:50%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--blue));transition:width .25s}.progress.warn i{background:linear-gradient(90deg,var(--yellow),var(--line2))}.progress.danger i{background:linear-gradient(90deg,var(--red),#ff9ab0)}.right{display:grid;grid-template-rows:auto 1fr auto;gap:10px;min-height:0}.crew{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.crew-card,.hero-card,.building-card{border:var(--stroke) solid rgba(53,217,255,.55);background:linear-gradient(180deg,rgba(20,50,77,.9),rgba(8,22,36,.94));border-radius:16px;padding:10px;box-shadow:0 0 16px rgba(53,217,255,.09);cursor:pointer}.crew-card h3,.hero-card h3,.building-card h3{font-size:14px;margin-bottom:7px;white-space:nowrap}.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.ring{aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),rgba(255,255,255,.08) 0);position:relative}.ring:after{content:"";position:absolute;inset:5px;border-radius:50%;background:#0b1d30}.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hero-card.active{border-color:var(--line2);box-shadow:0 0 24px rgba(255,159,56,.25)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;overflow:auto;padding-right:2px}.building-card{min-height:92px}.cost{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.mini{height:24px;font-size:12px;padding:0 7px}.dock{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.modal{position:fixed;inset:0;display:none;place-items:center;z-index:20;background:rgba(3,10,18,.62);backdrop-filter:blur(5px);padding:18px}.modal.show{display:grid}.modal .panel{width:min(560px,100%)}.modal p{line-height:1.65;color:#c8e8f3;margin-top:10px}.title{font-size:22px;color:#fff;text-shadow:0 0 14px rgba(53,217,255,.55)}.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:30;padding:10px 14px;border:2px solid var(--line2);border-radius:14px;background:#25180b;color:#fff;opacity:0;transition:.18s;font-weight:900}.toast.show{opacity:1}@media(max-width:820px){.app{gap:8px;padding-left:8px;padding-right:8px}.stage{grid-template-columns:1fr;grid-template-rows:46vh 1fr}.right{grid-template-rows:auto auto 1fr}.nav-bar{overflow:auto}.badge{height:34px;padding:0 8px}.crew,.heroes{grid-template-columns:1fr 1fr 1fr}.dock{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.station{width:76vw;height:76vw}.module{width:62px;height:46px}.core{width:88px;height:88px}.title{font-size:18px}}
</style></head><body><div class="app"><header class="nav-bar"><a class="btn" href="../"><i>⌂</i></a><div class="badge"><i>🧭</i><b id="route">Ⅰ-01</b></div><div class="badge"><i>🛰</i><b id="modules">00</b></div><div class="badge"><i>🧑‍🚀</i><b id="crew">03</b></div><div class="spacer"></div><button class="btn" id="music"><i>♪</i></button><button class="btn warn" id="help"><i>?</i></button></header><main class="stage"><section class="panel space"><div class="title">轨道残骸站</div><div class="station" id="station"><div class="core">◎</div></div><div class="event task-bar"><div class="progress" id="eva"><i></i></div><div class="dock"><button class="btn" id="scavenge"><i>🧲</i></button><button class="btn" id="evaBtn"><i>🚀</i></button><button class="btn" id="process"><i>⚙</i></button><button class="btn" id="sail"><i>🧭</i></button><button class="btn danger" id="rest"><i>✚</i></button></div></div></section><aside class="right"><section class="panel"><div class="dock" id="res"></div></section><section class="panel"><div class="crew" id="crewCards"></div><div class="heroes" id="heroes"></div></section><section class="panel grid" id="buildings"></section></aside></main><footer class="task-bar"><div class="dock"><div class="badge"><i>☀</i><b id="event">SAFE</b></div><div class="badge"><i>⏱</i><b id="timer">90</b></div><div class="badge"><i>★</i><b id="goal">08</b></div></div><div class="progress" id="routeProg"><i></i></div></footer></div><div class="modal" id="modal"><div class="panel"><h2 id="modalTitle">说明</h2><p id="modalText"></p><button class="btn warn" id="close">确认</button></div></div><div class="toast" id="toast"></div><script>
(function(){'use strict';var $=function(id){return document.getElementById(id)},S=JSON.parse(localStorage.getItem('orbit.v1')||'null')||{ch:1,lv:1,res:{scrap:30,o2:60,water:40,power:45,alloy:8,food:32,credit:20},built:{},crew:[70,72,68,66],hero:'captain',eva:90,storm:0,muted:false};var R={scrap:'▣',o2:'O₂',water:'💧',power:'⚡',alloy:'▰',food:'▤',credit:'◆'},N={scrap:'残骸',o2:'氧',water:'水',power:'电',alloy:'合金',food:'粮',credit:'信'},B=[['solar','☀',{power:20,alloy:2}],['oxy','O₂',{scrap:18,alloy:4}],['hydro','💧',{scrap:18,power:8}],['forge','▰',{scrap:28,power:12}],['farm','▤',{water:16,power:12}],['dock','🚀',{alloy:9,credit:12}],['radar','◉',{power:18,alloy:7}],['lab','✚',{water:12,food:10,alloy:6}],['market','◆',{scrap:24,food:12}],['shield','⬡',{alloy:18,power:22}]],H={captain:['舰长','🧑‍✈️',1.15],mechanic:['机械师','🔧',1.25],pilot:['领航员','🧭',1.18]},E=['SAFE','WIND','ROCK','RAD','SHIP'];var actx=null,tm=0;function pad(n){return String(Math.max(0,Math.floor(n))).padStart(2,'0')}function save(){localStorage.setItem('orbit.v1',JSON.stringify(S))}function toast(t){var e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},900)}function tone(f,d){if(S.muted)return;if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;actx=new AC}var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.03)}function badge(k,v){return '<div class="badge"><i>'+R[k]+'</i><b>'+pad(v)+'</b></div>'}function can(c){return Object.keys(c).every(function(k){return S.res[k]>=c[k]})}function pay(c){Object.keys(c).forEach(function(k){S.res[k]-=c[k]})}function render(){ $('route').textContent='ⅠⅡⅢ'[S.ch-1]+'-'+pad(S.lv);$('modules').textContent=pad(Object.keys(S.built).length);$('crew').textContent=pad(3);$('timer').textContent=pad(S.eva);$('goal').textContent=pad(8-S.lv%8);$('event').textContent=E[S.storm||0];$('routeProg').firstElementChild.style.width=((S.lv-1)%8+1)/8*100+'%';$('eva').firstElementChild.style.width=S.eva/90*100+'%';$('res').innerHTML=Object.keys(R).map(function(k){return badge(k,S.res[k])}).join('');$('crewCards').innerHTML=['心','氧','饥','精'].map(function(n,i){var v=S.crew[i],c=v<35?'var(--red)':v<60?'var(--yellow)':'var(--green)';return '<div class="crew-card"><h3>'+n+'</h3><div class="progress '+(v<35?'danger':v<60?'warn':'')+'"><i style="width:'+v+'%"></i></div></div>'}).join('');$('heroes').innerHTML=Object.keys(H).map(function(k){var h=H[k];return '<button class="hero-card '+(S.hero===k?'active':'')+'" data-hero="'+k+'"><h3>'+h[1]+' '+h[0]+'</h3><div class="progress"><i style="width:'+(h[2]*70)+'%"></i></div></button>'}).join('');$('buildings').innerHTML=B.map(function(b){var owned=S.built[b[0]],cost=Object.keys(b[2]).map(function(k){return '<span class="badge mini"><i>'+R[k]+'</i><b>'+pad(b[2][k])+'</b></span>'}).join('');return '<button class="building-card" data-b="'+b[0]+'"><h3>'+b[1]+' '+(owned?'已建':'建造')+'</h3><div class="progress"><i style="width:'+(owned?100:36)+'%"></i></div><div class="cost">'+cost+'</div></button>'}).join('');drawStation();save()}function drawStation(){var st=$('station');st.querySelectorAll('.module').forEach(function(e){e.remove()});Object.keys(S.built).forEach(function(k,i){var b=B.find(function(x){return x[0]===k}),m=document.createElement('div'),a=i/Object.keys(S.built).length*Math.PI*2;m.className='module';m.textContent=b?b[1]:'□';m.style.left=(50+Math.cos(a)*39)+'%';m.style.top=(50+Math.sin(a)*39)+'%';m.style.transform='translate(-50%,-50%)';st.appendChild(m)});for(var i=0;i<18;i++){var d=document.createElement('i');d.className='debris';d.style.left=(Math.random()*100)+'%';d.style.top=(Math.random()*100)+'%';st.appendChild(d);setTimeout(function(x){x.remove()},1400,d)}}function build(k){var b=B.find(function(x){return x[0]===k});if(!b||S.built[k])return toast('已完成');if(!can(b[2]))return toast('资源不足');pay(b[2]);S.built[k]=1;tone(660,.12);render()}function scavenge(){var f=H[S.hero][2];S.res.scrap+=Math.round(8*f);S.res.credit+=Math.round(2*f);S.crew[3]-=4;S.eva=Math.max(0,S.eva-8);tone(420,.08);tickEvent();render()}function process(){var n=Object.keys(S.built).length;if(S.built.oxy)S.res.o2+=7;if(S.built.hydro)S.res.water+=6;if(S.built.solar)S.res.power+=8;if(S.built.forge&&S.res.scrap>=8){S.res.scrap-=8;S.res.alloy+=3}if(S.built.farm&&S.res.water>=4){S.res.water-=4;S.res.food+=6}if(S.built.market&&S.res.food>=5){S.res.food-=5;S.res.credit+=8}S.crew[1]-=2;S.crew[2]-=3;toast(n?'加工完成':'需要功能舱');tone(520,.1);render()}function eva(){if(S.res.o2<10)return toast('氧不足');S.res.o2-=10;S.eva=90;S.res.scrap+=18;S.res.alloy+=2;S.crew[0]-=5;S.crew[3]-=8;toast('出舱回收');tone(760,.16);render()}function sail(){if(Object.keys(S.built).length<Math.min(10,2+S.lv))return toast('舱段不足');if(S.res.power<12||S.res.o2<12)return toast('补给不足');S.res.power-=12;S.res.o2-=12;S.lv++;if(S.lv>8){S.lv=1;S.ch=Math.min(3,S.ch+1)}S.crew=S.crew.map(function(v){return Math.min(100,v+8)});toast('航线推进');tone(880,.2);render()}function rest(){if(S.res.food<8||S.res.water<6)return toast('补给不足');S.res.food-=8;S.res.water-=6;S.crew=S.crew.map(function(v){return Math.min(100,v+18)});tone(300,.12);render()}function tickEvent(){S.storm=Math.random()<.22?1+Math.floor(Math.random()*4):0;if(S.storm===1)S.res.power=Math.max(0,S.res.power-10);if(S.storm===2)S.res.alloy=Math.max(0,S.res.alloy-3);if(S.storm===3)S.crew[0]-=9;if(S.storm===4){S.res.food+=10;S.res.water+=8}}document.addEventListener('click',function(e){var b=e.target.closest('[data-b]');if(b)build(b.dataset.b);var h=e.target.closest('[data-hero]');if(h){S.hero=h.dataset.hero;render()}});$('scavenge').onclick=scavenge;$('process').onclick=process;$('evaBtn').onclick=eva;$('sail').onclick=sail;$('rest').onclick=rest;$('music').onclick=function(){S.muted=!S.muted;this.innerHTML='<i>'+(S.muted?'×':'♪')+'</i>';save()};$('help').onclick=function(){$('modalTitle').textContent='轨道碎片带规则';$('modalText').textContent='从残骸拾荒，建造功能舱，把原料加工成氧气、水、电力、合金、食物和信用点。维持乘员四项状态，出舱会消耗氧气倒计时，完成三章航线推进。';$('modal').classList.add('show')};$('close').onclick=function(){$('modal').classList.remove('show')};setInterval(function(){S.eva=Math.max(0,S.eva-1);if(S.eva===0){S.crew[1]=Math.max(0,S.crew[1]-3)}tm++;if(tm%8===0&&Object.keys(S.built).length)process();render()},1000);render();})();
</script></body></html>
