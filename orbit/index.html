<div class="app">
<header class="nav-bar" id="topBar"></header>
<main class="stage">
<section class="panel space">
  <div class="scene-title"><div class="title">轨道残骸站</div><div id="sceneBadges"></div></div>
  <div class="scene safe" id="scene"><div class="orbit-ring"></div><div class="station-core" id="core"><div class="core-halo"></div></div><div id="modulesLayer"></div><div id="debrisLayer"></div><div class="event-banner" id="eventBanner"></div></div>
</section>
<aside class="right">
  <section class="panel"><div class="resource-grid" id="resources"></div></section>
  <section class="panel"><div class="crew-grid" id="crewCards"></div><div class="hero-grid" id="heroes"></div></section>
  <section class="panel building-list" id="buildings"></section>
</aside>
</main>
<footer class="task-bar"><div class="objective" id="objective"></div><div class="actions" id="actions"></div></footer>
</div>
<div class="modal" id="modal"><div class="modal-card"><h2 id="modalTitle"></h2><p id="modalText"></p><div class="guide-actions" id="modalActions"></div></div></div>
<div class="guide" id="guide"><div class="guide-card"><h2 id="guideTitle"></h2><p id="guideText"></p><div class="guide-actions"><button class="btn" id="skipGuide"></button><button class="btn warn" id="nextGuide"></button></div></div></div>

<script>
(function(){'use strict';
var $=function(id){return document.getElementById(id)},SAVE='orbit.v2',OLD='orbit.v1';
var ICONS=['home','help','music','route','module','crew','scrap','o2','water','power','alloy','food','credit','heart','oxygen','hunger','morale','captain','mechanic','pilot','solar','oxy','hydro','forge','farm','dock','radar','lab','market','shield','scavenge','eva','process','sail','rest','event','timer','goal'];
var RES={scrap:['scrap','残骸'],o2:['o2','氧气'],water:['water','水'],power:['power','电力'],alloy:['alloy','合金'],food:['food','食物'],credit:['credit','信用']};
var BUILD=[['solar','solar','太阳翼',{power:20,alloy:2},'稳定产电'],['oxy','oxy','制氧舱',{scrap:18,alloy:4},'生产氧气'],['hydro','hydro','净水舱',{scrap:18,power:8},'回收水源'],['forge','forge','熔炉舱',{scrap:28,power:12},'冶炼合金'],['farm','farm','农培舱',{water:16,power:12},'培育食物'],['dock','dock','对接口',{alloy:9,credit:12},'补给贸易'],['radar','radar','雷达舱',{power:18,alloy:7},'预警航线'],['lab','lab','医疗舱',{water:12,food:10,alloy:6},'稳定健康'],['market','market','贸易舱',{scrap:24,food:12},'换取信用'],['shield','shield','护盾舱',{alloy:18,power:22},'抵御灾害']];
var HERO={captain:['captain','舰长',1.15],mechanic:['mechanic','机械师',1.25],pilot:['pilot','领航员',1.18]};
var EVENTS={safe:['event','静默轨道','系统稳定，适合扩张','safe'],wind:['power','粒子风暴','电力受扰，舱段闪烁','wind'],rock:['alloy','碎岩带','外壳受损，合金消耗','rock'],rad:['heart','辐射潮','乘员健康持续下降','rad'],ship:['credit','商船信号','可获得补给','ship']};
var CREW=[['heart','健康'],['oxygen','氧压'],['food','饱食'],['morale','士气']];
function dstate(){return{version:2,state:'playing',ch:1,lv:1,res:{scrap:32,o2:64,water:42,power:48,alloy:8,food:36,credit:22},built:{},crew:[78,76,74,72],hero:'captain',eva:90,event:'safe',eventTick:0,guideStep:0,guideDone:false,hasSeenIntro:false,muted:false,stats:{actions:0,built:0,route:0,events:0},lastSave:Date.now(),debrisSeed:Math.floor(Math.random()*9999)}}
function norm(s){var d=dstate();s=s&&typeof s==='object'?s:{};Object.keys(d).forEach(function(k){if(s[k]==null)s[k]=d[k]});Object.keys(d.res).forEach(function(k){s.res[k]=safeNum(s.res[k],d.res[k])});if(!s.built)s.built={};if(!Array.isArray(s.crew))s.crew=d.crew;s.crew=s.crew.map(function(v,i){return clamp(safeNum(v,d.crew[i]),0,100)});s.ch=clamp(safeNum(s.ch,1),1,3);s.lv=clamp(safeNum(s.lv,1),1,8);s.eva=clamp(safeNum(s.eva,90),0,90);s.event=EVENTS[s.event]?s.event:'safe';s.hero=HERO[s.hero]?s.hero:'captain';s.state=s.state||'playing';s.version=2;return s}
function load(){try{return norm(JSON.parse(localStorage.getItem(SAVE)||localStorage.getItem(OLD)||'null'))}catch(e){return dstate()}}function save(){S.lastSave=Date.now();localStorage.setItem(SAVE,JSON.stringify(S))}function reset(keep){var muted=S&&S.muted;S=dstate();if(keep)S.muted=muted;save();render();showIntro()}var S=load(),actx=null,tick=0;
function safeNum(v,d){v=Number(v);return Number.isFinite(v)?v:d}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function roman(n){return ['Ⅰ','Ⅱ','Ⅲ'][n-1]||'Ⅰ'}function pad(n){return String(Math.max(0,Math.floor(n))).padStart(2,'0')}function icon(n,c){return '<i class="ico '+(c||'')+'" style="background-image:url(\'icons/'+n+'.png\')"></i>'}function badge(iconName,val,label,state){return '<div class="badge '+(state||'')+'">'+icon(iconName)+'<b>'+val+'</b>'+(label?'<small>'+label+'</small>':'')+'</div>'}function btn(id,iconName,label,type,disabled){return '<button class="btn '+(type||'')+'" id="'+id+'" '+(disabled?'disabled':'')+'>'+icon(iconName)+'<span>'+label+'</span></button>'}function prog(v,state){return '<div class="progress '+(state||'')+'"><i style="width:'+clamp(v,0,100)+'%"></i></div>'}function cost(o){return '<div class="cost">'+Object.keys(o).map(function(k){return '<span class="badge mini">'+icon(RES[k][0],'sm')+'<b>'+pad(o[k])+'</b></span>'}).join('')+'</div>'}
function tone(f,d,type){if(S.muted)return;if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;actx=new AC}var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.07,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.04)}function toast(t,kind){var e=$('toast');e.textContent=t;e.style.borderColor=kind==='danger'?'var(--danger)':kind==='ok'?'var(--ok)':'var(--warn)';e.classList.add('show');setTimeout(function(){e.classList.remove('show')},1000)}function fx(t,kind,x,y){var e=document.createElement('div');e.className='float '+(kind||'');e.textContent=t;e.style.left=(x||50)+'%';e.style.top=(y||50)+'%';$('fxLayer').appendChild(e);setTimeout(function(){e.remove()},1050)}function flash(id){var e=$(id);if(!e)return;e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash')}function can(c){return Object.keys(c).every(function(k){return S.res[k]>=c[k]})}function pay(c){Object.keys(c).forEach(function(k){S.res[k]=Math.max(0,S.res[k]-c[k]);fx('-'+pad(c[k]),'danger',65,16)})}function add(k,v){S.res[k]=Math.max(0,S.res[k]+v);fx((v>=0?'+':'')+pad(v),v>=0?'ok':'danger',45+Math.random()*12,24+Math.random()*12)}function crewDelta(i,v){S.crew[i]=clamp(S.crew[i]+v,0,100)}function objective(){var built=Object.keys(S.built).length;if(!S.built.solar)return['建造太阳翼','先拾荒收集残骸，再点亮第一座电力舱。','solar'];if(!S.built.oxy)return['建造制氧舱','氧气决定出舱探索时间，优先保障生命线。','oxy'];if(S.lv===1&&S.ch===1)return['推进首段航线','准备足够氧气与电力，把残骸站推向下一个轨道点。','route'];if(built<6)return['扩建功能舱','继续建造加工、补给和防护舱段，让空间站形成闭环。','module'];if(!S.built.shield)return['建造护盾舱','后期灾害更强，护盾舱是最终航线的保险。','shield'];return['完成最终航线','维持乘员状态，推进到第三章终点。','goal']}function eventInfo(){return EVENTS[S.event]||EVENTS.safe}
function render(){renderTop();renderScene();renderResources();renderCrew();renderBuild();renderFooter();renderGuide();save()}
function renderTop(){var danger=S.crew.some(function(v){return v<30})?'danger':'';$('topBar').innerHTML='<a class="btn" href="../">'+icon('home')+'<span>大厅</span></a>'+badge('route',roman(S.ch)+'-'+pad(S.lv),'航线')+badge('o2',pad(S.res.o2),'氧',S.res.o2<20?'danger':'')+badge('power',pad(S.res.power),'电',S.res.power<20?'warn':'')+badge('food',pad(S.res.food),'粮',S.res.food<20?'warn':'')+badge('credit',pad(S.res.credit),'信')+badge('module',pad(Object.keys(S.built).length),'舱段')+badge('crew',pad(3),'乘员',danger)+'<div class="spacer"></div>'+btn('music','music',S.muted?'静音':'音效','',false)+btn('help','help','设置','warn',false)}
function debrisPos(i){var x=(Math.sin((S.debrisSeed+i*41)*12.9898)*43758.5453)%1;if(x<0)x+=1;var y=(Math.sin((S.debrisSeed+i*73)*78.233)*19341.13)%1;if(y<0)y+=1;return[Math.round(x*92+4),Math.round(y*82+8)]}
function renderScene(){var ev=eventInfo(),scene=$('scene');scene.className='scene '+ev[3];$('sceneBadges').innerHTML=badge('timer',pad(S.eva),'EVA',S.eva<25?'danger':S.eva<45?'warn':'')+badge(ev[0],ev[1],'事件',S.event==='safe'?'ok':S.event==='rad'?'danger':'warn');$('core').innerHTML='<div class="core-halo"></div>'+icon('module','lg');var mods=Object.keys(S.built),html='';mods.forEach(function(k,i){var b=BUILD.find(function(x){return x[0]===k}),a=i/Math.max(1,mods.length)*Math.PI*2,r=mods.length>6?42:37;html+='<div class="module done" style="left:'+(50+Math.cos(a)*r)+'%;top:'+(50+Math.sin(a)*r)+'%;transform:translate(-50%,-50%)">'+icon(b[1],'lg')+'</div>'});$('modulesLayer').innerHTML=html;if(!$('debrisLayer').dataset.ready){var d='',items=['panel','pipe','crate','o2','alloy','credit','food','water'];for(var i=0;i<18;i++){var p=debrisPos(i),it=items[i%items.length];d+='<i class="debris '+it+'" style="left:'+p[0]+'%;top:'+p[1]+'%;animation-delay:'+((i%7)*-.4)+'s"></i>'}$('debrisLayer').innerHTML=d;$('debrisLayer').dataset.ready='1'}$('eventBanner').innerHTML=icon(ev[0])+'<div><h3>'+ev[1]+'</h3><p>'+ev[2]+'</p></div>'+badge('timer',pad(Math.max(0,8-S.eventTick)),'轮')}
function renderResources(){$('resources').innerHTML=Object.keys(RES).map(function(k){var st=S.res[k]<10?'danger':S.res[k]<25?'warn':'';return badge(RES[k][0],pad(S.res[k]),RES[k][1],st)}).join('')}
function renderCrew(){$('crewCards').innerHTML=CREW.map(function(c,i){var v=S.crew[i],st=v<30?'danger':v<55?'warn':'',col=v<30?'var(--danger)':v<55?'var(--warn)':'var(--ok)';return '<div class="card"><h3>'+icon(c[0])+'<span>'+c[1]+'</span></h3><div class="rings"><span class="ring" style="--v:'+v+';--c:'+col+'"></span><span class="ring" style="--v:'+Math.max(0,v-12)+';--c:'+col+'"></span><span class="ring" style="--v:'+Math.max(0,v-24)+';--c:'+col+'"></span><span class="ring" style="--v:'+Math.max(0,v-36)+';--c:'+col+'"></span></div>'+prog(v,st)+'</div>'}).join('');$('heroes').innerHTML=Object.keys(HERO).map(function(k){var h=HERO[k];return '<button class="card '+(S.hero===k?'active':'')+'" data-hero="'+k+'"><h3>'+icon(h[0])+'<span>'+h[1]+'</span></h3>'+prog(h[2]*70,'')+'</button>'}).join('')}
function missing(c){var m=Object.keys(c).filter(function(k){return S.res[k]<c[k]})[0];return m?RES[m][1]+'不足':''}
function renderBuild(){$('buildings').innerHTML=BUILD.map(function(b){var done=S.built[b[0]],miss=missing(b[3]);return '<button class="card '+(done?'done':'')+'" data-b="'+b[0]+'" '+(done?'disabled':'')+'><h3>'+icon(b[1])+'<span>'+b[2]+'</span></h3><p>'+(done?'舱段已接入轨道环':b[4])+'</p>'+prog(done?100:(miss?25:55),miss?'danger':'')+cost(b[3])+(miss?'<p>'+miss+'</p>':'')+'</button>'}).join('')}
function renderFooter(){var o=objective(),disableSail=Object.keys(S.built).length<Math.min(10,2+S.lv)||S.res.power<12||S.res.o2<12;$('objective').innerHTML='<div class="task-line"><h3>'+icon(o[2])+' '+o[0]+'</h3>'+badge('goal',roman(S.ch)+'-'+pad(S.lv),'目标')+'</div><p>'+o[1]+'</p>'+prog(((S.lv-1)%8+1)/8*100,'');$('actions').innerHTML=btn('actScavenge','scavenge','拾荒','',false)+btn('actEva','eva','出舱','',S.res.o2<10)+btn('actProcess','process','加工','',!Object.keys(S.built).length)+btn('actSail','sail','推进','warn',disableSail)+btn('actRest','rest','休整','danger',S.res.food<8||S.res.water<6)}
function action(name){if(S.state!=='playing')return;S.stats.actions++;if(name==='scavenge')scavenge();if(name==='eva')eva();if(name==='process')manualProcess();if(name==='sail')sail();if(name==='rest')rest();advanceGuide(name);checkEnd();render()}
function scavenge(){var f=HERO[S.hero][2];add('scrap',Math.round(9*f));add('credit',Math.round(2*f));crewDelta(3,-4);S.eva=clamp(S.eva-7,0,90);maybeEvent();tone(440,.08);toast('回收到可用残骸','ok');flash('scene')}
function eva(){if(S.res.o2<10)return toast('氧气不足','danger');add('o2',-10);S.eva=90;add('scrap',18);add('alloy',2);crewDelta(0,-5);crewDelta(3,-8);maybeEvent();tone(760,.15);toast('出舱回收完成','ok');flash('scene')}
function autoProduce(){if(S.state!=='playing')return;var changed=false;if(S.built.oxy){S.res.o2+=3;changed=true}if(S.built.hydro){S.res.water+=2;changed=true}if(S.built.solar){S.res.power+=3;changed=true}if(S.built.forge&&S.res.scrap>=8){S.res.scrap-=8;S.res.alloy+=2;changed=true}if(S.built.farm&&S.res.water>=4){S.res.water-=4;S.res.food+=3;changed=true}if(S.built.market&&S.res.food>=5){S.res.food-=5;S.res.credit+=5;changed=true}if(changed)flash('resources')}
function manualProcess(){if(!Object.keys(S.built).length)return toast('先建造功能舱','danger');autoProduce();crewDelta(1,-1);crewDelta(2,-2);tone(560,.1);toast('加工链路运转','ok');fx('生产完成','ok',52,58)}
function build(k){if(S.state!=='playing')return;var b=BUILD.find(function(x){return x[0]===k});if(!b||S.built[k])return;if(!can(b[3])){toast(missing(b[3]),'danger');return}pay(b[3]);S.built[k]=1;S.stats.built++;tone(660,.16);toast(b[2]+'接入','ok');fx('舱段完成','ok',50,45);advanceGuide('build:'+k);render()}
function sail(){var need=Object.keys(S.built).length<Math.min(10,2+S.lv)||S.res.power<12||S.res.o2<12;if(need)return toast('航线条件不足','danger');add('power',-12);add('o2',-12);S.lv++;S.stats.route++;if(S.lv>8){S.lv=1;S.ch++;fx('章节突破','ok',50,35)}if(S.ch>3){win();return}S.crew=S.crew.map(function(v){return clamp(v+8,0,100)});tone(880,.22);toast('航线推进','ok');advanceGuide('sail');flash('scene')}
function rest(){if(S.res.food<8||S.res.water<6)return toast('补给不足','danger');add('food',-8);add('water',-6);S.crew=S.crew.map(function(v){return clamp(v+18,0,100)});tone(320,.12);toast('乘员恢复','ok')}
function maybeEvent(){if(Math.random()<.25){var keys=['wind','rock','rad','ship'];S.event=keys[Math.floor(Math.random()*keys.length)];S.eventTick=0;S.stats.events++;applyEvent();toast(eventInfo()[1],S.event==='rad'?'danger':'warn')}}function applyEvent(){if(S.event==='wind')add('power',-8);if(S.event==='rock')add('alloy',-2);if(S.event==='rad')crewDelta(0,-8);if(S.event==='ship'){add('food',8);add('water',6)}}
function checkEnd(){if(S.crew[0]<=0)return fail('健康归零');if(S.res.o2<=0&&S.eva<=0)return fail('氧气耗尽');if(S.res.food<=0&&S.res.water<=0)return fail('补给崩溃')}function fail(r){S.state='failed';showModal('任务失败',r+'。残骸站已进入休眠模式。','重新开始',function(){reset(true)})}function win(){S.state='won';showModal('航线完成','第三章终点已抵达，轨道残骸站成为稳定前哨。','再开一局',function(){reset(true)})}
function showModal(t,txt,btnText,cb){$('modalTitle').textContent=t;$('modalText').textContent=txt;$('modalActions').innerHTML='<button class="btn" id="modalClose">关闭</button><button class="btn warn" id="modalOk">'+btnText+'</button>';$('modal').classList.add('show');$('modalClose').onclick=function(){$('modal').classList.remove('show')};$('modalOk').onclick=function(){$('modal').classList.remove('show');cb&&cb()}}
function showIntro(){if(S.hasSeenIntro)return;S.hasSeenIntro=true;S.guideStep=0;showModal('接管残骸站','在地球轨道碎片带中回收残骸，建造功能舱，维持乘员状态，并推进三章航线。','开始接管',function(){S.guideStep=1;render()})}
var G=[null,['拾荒行动','先点底部“拾荒”，收集第一批残骸和信用点。','actScavenge'],['建造太阳翼','资源足够后，点建筑区的“太阳翼”，让空间站拥有稳定电力。','solar'],['启动加工','建成舱段后，点“加工”让资源链开始运转。','actProcess'],['推进航线','补给达标后，点“推进”，完成第一段航线。','actSail']];function renderGuide(){var g=$('guide');document.querySelectorAll('.guide-focus').forEach(function(e){e.classList.remove('guide-focus')});if(S.guideDone||!S.guideStep||S.state!=='playing'){g.classList.remove('show');return}var step=G[S.guideStep];if(!step){S.guideDone=true;g.classList.remove('show');return}$('guideTitle').textContent=step[0];$('guideText').textContent=step[1];$('skipGuide').innerHTML=icon('help')+'<span>跳过</span>';$('nextGuide').innerHTML=icon('goal')+'<span>知道了</span>';g.classList.add('show');setTimeout(function(){var el=$(step[2])||document.querySelector('[data-b="'+step[2]+'"]');if(el)el.classList.add('guide-focus')},30)}function advanceGuide(a){if(S.guideDone)return;if(S.guideStep===1&&a==='scavenge')S.guideStep=2;else if(S.guideStep===2&&a==='build:solar')S.guideStep=3;else if(S.guideStep===3&&a==='process')S.guideStep=4;else if(S.guideStep===4&&a==='sail'){S.guideDone=true;S.guideStep=0;toast('引导完成','ok')}};
function wire(){document.addEventListener('click',function(e){var b=e.target.closest('[data-b]');if(b)build(b.dataset.b);var h=e.target.closest('[data-hero]');if(h){S.hero=h.dataset.hero;tone(520,.08);render()}});$('actions').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.disabled)return;var id=b.id.replace('act','').toLowerCase();action(id)});$('topBar').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.id==='music'){S.muted=!S.muted;render()}if(b.id==='help'){showModal('设置与说明','目标：完成三章航线。资源都在图标徽章中，乘员状态用环形刻度和颜色表示。优先建造太阳翼、制氧舱、净水舱，再扩展熔炉和农培舱。','清除存档',function(){reset(true)})}});$('skipGuide').onclick=function(){S.guideDone=true;S.guideStep=0;render()};$('nextGuide').onclick=function(){$('guide').classList.remove('show')}}
setInterval(function(){if(S.state!=='playing')return;tick++;S.eva=clamp(S.eva-1,0,90);if(S.eva===0)crewDelta(1,-1);var needRender=false;if(tick%8===0){autoProduce();needRender=true}if(tick%12===0){S.eventTick++;if(S.eventTick>7){S.event='safe';S.eventTick=0}needRender=true}checkEnd();if(needRender)render();else save()},1000);
wire();render();showIntro();
})();
</script>
</body></html>
